name: B7 spike · Bun 1.4.2 cross-compile nativo

# Sonda de mecanismo, no de producto. Responde en una sola corrida, sin teléfono:
#   A  ¿el host Bun 1.4.2 oficial acepta --target=...-android y sobrevive el
#      override de la base (BUN_COMPILE_TARGET_TARBALL_URL / override de registry)?
#   B  ¿qué URL y qué ruta de caché usa para bajar la base del target?
#   C  ¿se puede inyectar el ELF parcheado de Leonisaurov/bun-android como base?
#      C1 env · C2/C2b caché y cwd · C3 registry · C4 qemu-user como emisor.
#   D  ¿cómo pliega OpenTUI la resolución de su librería nativa bajo platform=android?
#      D2: si el slot arm64 se embute de verdad (decide el swap del .so Bionic).
#   F  control del DCE: qué forma de import sobrevive al --target.
#   E  ¿queda el re-export roto de undici en un grafo 1.4.2 (sin parche de bytes)?
# Iteración 2: la 1 (run 38112875770) dejó G1 sin cumplir — las tres vías de
# inyección cayeron en la base oficial porque la caché del runner ya estaba
# poblada y los nombres sembrados estaban mal escritos. Aquí todo corre con
# HOME aislado y el nombre que B leyó de su propio log.
# No publica nada ni toca el pipeline de main.

on:
  workflow_dispatch:
  push:
    branches:
      - feat/bun-142-native
    paths:
      - .github/workflows/spike-bun142-native.yml

concurrency:
  group: spike-bun142-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_ANDROID_TAG: "v1.4.2-android.1"
  BUN_ANDROID_ASSET: "bun-aarch64-android"
  BUN_ANDROID_SHA256: "3c61913c9420c578536225e4f11a85ecf9619a26f6c0094d06b06bff30de31f9"
  BUN_ANDROID_UPSTREAM_COMMIT: "744846f844374847c902b5e7fd59b4342a51ef99"
  BUN_ANDROID_REVISION: "1.4.2-canary.1+0c087fdb9"
  HOST_BUN_VERSION: "1.4.2"
  OPENTUI_VERSION: "0.5.14"

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        id: setup
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/report"; mkdir -p "$REPORT"
          echo "REPORT=$REPORT" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu qemu-user-static >/dev/null
          readelf --version | head -1
          aarch64-linux-gnu-strip --version | head -1
          command -v qemu-aarch64-static

      # ── A: qué acepta el host 1.4.2 ────────────────────────────────
      - name: 'A: host Bun 1.4.2 oficial y su superficie de --target'
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/bun-host.zip" \
            "https://github.com/oven-sh/bun/releases/download/bun-v${HOST_BUN_VERSION}/bun-linux-x64.zip"
          sha256sum "$RUNNER_TEMP/bun-host.zip" | tee "$REPORT/a-host-sha.txt"
          unzip -q "$RUNNER_TEMP/bun-host.zip" -d "$RUNNER_TEMP/host"
          install -m 0755 "$RUNNER_TEMP/host/bun-linux-x64/bun" "$RUNNER_TEMP/bun"
          "$RUNNER_TEMP/bun" --revision | tee "$REPORT/a-host-revision.txt"
          "$RUNNER_TEMP/bun" build --help > "$REPORT/a-build-help.txt" 2>&1 || true
          {
            "$RUNNER_TEMP/bun" --revision
            echo '--- help: target/compile ---'
            grep -aiE 'target|compile|--use|conditions|registry' "$REPORT/a-build-help.txt" || true
            echo '--- strings: env overrides y URLs de base ---'
            strings -a "$RUNNER_TEMP/bun" | grep -aoiE \
              '[A-Z_]*COMPILE[A-Z_]*|[A-Z_]*BUN_CONFIG_REGISTRY[A-Z_]*|[A-Z_]*TARBALL[A-Z_]*|[A-Z_]*BUN_[A-Z_]*|[A-Z_]*_TARGET[A-Z_]*|registry\.npmjs\.org[^"]{0,40}|github\.com/oven-sh/bun/releases[^"]{0,40}|@oven/[-a-z0-9]*|bun-linux-[a-z0-9-]*android[a-z0-9-]*' \
              | sort -u || true
          } > "$REPORT/a-surface.txt" 2>&1
          cat "$REPORT/a-surface.txt"

      # ── B: cross-compile con base oficial ──────────────────────────
      - name: 'B: --target android con base oficial (huella de red y caché)'
        continue-on-error: true
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/spike"; mkdir -p "$WORK"; cd "$WORK"
          printf 'console.log(JSON.stringify({p:process.platform,a:process.arch,v:Bun.version,r:Bun.revision}))\n' > hello.ts
          touch "$WORK/.marker"
          set +e
          for T in bun-linux-arm64-android bun-linux-aarch64-android bun-android-arm64; do
            echo "=== target=$T ==="
            "$RUNNER_TEMP/bun" build --compile --target="$T" hello.ts --outfile "hello-$T" 2>&1
            echo "rc=$?"
          done > "$REPORT/b-attempts.txt" 2>&1
          set -e
          cat "$REPORT/b-attempts.txt"
          echo '--- qué dejó en disco la corrida (ruta exacta de la base) ---' > "$REPORT/b-footprint.txt"
          find "$HOME/.bun" "$HOME/.cache" /tmp "$RUNNER_TEMP" -xdev -newer "$WORK/.marker" -type f \
            2>/dev/null | grep -av "$WORK" | head -60 >> "$REPORT/b-footprint.txt" || true
          BIN="$(ls -1 "$WORK"/hello-* 2>/dev/null | head -1 || true)"
          if [ -n "$BIN" ]; then
            {
              echo "bin=$BIN"; ls -l "$BIN"; sha256sum "$BIN"
              readelf -h "$BIN" | grep -aE 'Class|Machine|Type|Entry' || true
              echo '--- secciones ---'
              readelf -S "$BIN" | grep -aE '\.bun|\.text|section headers' || echo 'sin .bun'
              readelf -d "$BIN" | grep -aE 'NEEDED|INTERP' || true
              readelf -l "$BIN" | grep -acE 'LOAD' | sed 's/^/carga_LOAD=/' || true
            } >> "$REPORT/b-footprint.txt" || true
          fi
          cat "$REPORT/b-footprint.txt"

      - name: 'B2: prueba de la base oficial en qemu-user (informativo)'
        continue-on-error: true
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/spike"
          BIN="$(ls -1 hello-* 2>/dev/null | head -1 || true)"
          test -n "$BIN"
          # El standalone arranca con el linker bionic; sin sysroot android real
          # esto se espera que falle. Se registra igual para cerrar la vía.
          qemu-aarch64-static -L /usr "$BIN" > "$REPORT/b2-qemu.txt" 2>&1
          cat "$REPORT/b2-qemu.txt"

      # ── C: inyección de la base parcheada ──────────────────────────
      - name: 'C0: bajar y despojar la base de Leonisaurov/bun-android'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o base-elf.raw \
            "https://github.com/Leonisaurov/bun-android/releases/download/${BUN_ANDROID_TAG}/${BUN_ANDROID_ASSET}"
          echo "${BUN_ANDROID_SHA256}  base-elf.raw" | sha256sum -c - | tee "$REPORT/c0-sha-verify.txt"
          ls -l base-elf.raw >> "$REPORT/c0-sha-verify.txt"
          # --strip-debug preserva .dynsym/.dynamic/.bun (SHF_ALLOC) y el interp.
          aarch64-linux-gnu-strip --strip-debug base-elf.raw -o base-elf
          {
            echo '--- tamaño tras strip ---'; ls -l base-elf base-elf.raw
            echo '--- dynamic ---'; readelf -d base-elf | grep -aE 'NEEDED|FLAGS' || true
            echo '--- secciones clave ---'
            readelf -S base-elf | grep -aE '\.bun|\.dynsym|\.dynamic|\.gnu_debug' || true
            echo '--- ¿queda DWARF? ---'
            readelf -S base-elf | grep -ac '\.debug_' | sed 's/^/debug_secciones_restantes=/'
            echo '--- linaje ---'
            grep -ac "$BUN_ANDROID_REVISION" base-elf | sed 's/^/marcador_revision=/'
          } > "$REPORT/c0-strip.txt" || true
          cat "$REPORT/c0-strip.txt"

      - name: 'C1: BUN_COMPILE_TARGET_TARBALL_URL con HOME aislado (sin cache hit)'
        continue-on-error: true
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          # Iteración 2: B ya había poblado la caché real, así que el env nunca se
          # consultó. Se corre con HOME virgen y el nombre que reporta el compile.
          rm -rf npm && mkdir -p npm/package/bin
          install -m 0755 base-elf npm/package/bin/bun
          printf '{"name":"@oven/bun-linux-aarch64-android","version":"%s","bin":{"bun":"bin/bun"}}\n' \
            "${HOST_BUN_VERSION}" > npm/package/package.json
          tar -czf npm/package.tgz -C npm package
          HOME_ISO="$RUNNER_TEMP/home-c1"; rm -rf "$HOME_ISO"; mkdir -p "$HOME_ISO/.bun/install/cache"
          python3 -m http.server 8021 --directory "$RUNNER_TEMP/npm" > "$REPORT/c1-server.log" 2>&1 &
          SRV=$!; sleep 1
          cd "$RUNNER_TEMP/spike"
          set +e
          HOME="$HOME_ISO" BUN_COMPILE_TARGET_TARBALL_URL="http://127.0.0.1:8021/package.tgz" \
            "$RUNNER_TEMP/bun" build --compile --target=bun-linux-arm64-android hello.ts \
            --outfile hello-c1 > "$REPORT/c1-build.log" 2>&1
          echo "rc=$?" >> "$REPORT/c1-build.log"
          kill "$SRV" 2>/dev/null || true
          set -e
          {
            echo '--- que dejo la corrida en el HOME aislado ---'
            find "$HOME_ISO" -type f -printf '%p\t%s\n' | head -20
            echo '--- peticiones recibidas por el servidor local ---'
            cat "$REPORT/c1-server.log"
            echo '--- tamano y linaje del standalone ---'
            ls -l hello-c1 2>/dev/null || echo 'sin hello-c1'
            echo "canary=$(grep -ac "$BUN_ANDROID_REVISION" hello-c1 2>/dev/null || true)"
            echo "oficial=$(grep -ac '1.4.2+744846f84' hello-c1 2>/dev/null || true)"
          } >> "$REPORT/c1-build.log"
          cat "$REPORT/c1-build.log"

      - name: 'C2: base parcheada sembrada en el fetch cache (nombre exacto de B)'
        continue-on-error: true
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/spike"
          # Iteración 2: B probó que la base vive en UN archivo de la caché de bun
          # con el nombre que el propio log del compile imprime
          # ("... compile hello-X bun-linux-aarch64-android-v1.4.2"). En la
          # iteración 1 se sembraron nombres mal escritos (arm64 en vez de
          # aarch64) y encima con la caché real ya poblada => bun nunca miró el
          # seed. Aquí: HOME aislado + los nombres candidatos correctos.
          HOME_ISO="$RUNNER_TEMP/home-c2"; rm -rf "$HOME_ISO"
          CACHE="$HOME_ISO/.bun/install/cache"; mkdir -p "$CACHE"
          : > "$REPORT/c2-seed.log"
          for NAME in "bun-linux-aarch64-android-v${HOST_BUN_VERSION}" \
                      "bun-linux-aarch64-android-${HOST_BUN_VERSION}" \
                      "bun-linux-arm64-android-v${HOST_BUN_VERSION}"; do
            install -m 0755 "$RUNNER_TEMP/base-elf" "$CACHE/$NAME"
            echo "seeded $CACHE/$NAME $(stat -c%s "$CACHE/$NAME")" >> "$REPORT/c2-seed.log"
          done
          set +e
          HOME="$HOME_ISO" "$RUNNER_TEMP/bun" build --compile \
            --target=bun-linux-arm64-android hello.ts --outfile hello-c2 \
            >> "$REPORT/c2-seed.log" 2>&1
          echo "rc=$?" >> "$REPORT/c2-seed.log"
          set -e
          {
            echo '--- que dejo el HOME aislado (debe ser solo lo sembrado) ---'
            find "$HOME_ISO" -type f -printf '%p\t%s\n' | head -20
            echo '--- tamano y linaje del standalone ---'
            ls -l hello-c2 2>/dev/null || echo 'sin hello-c2'
            echo "canary=$(grep -ac "$BUN_ANDROID_REVISION" hello-c2 2>/dev/null || true)"
            echo "oficial=$(grep -ac '1.4.2+744846f84' hello-c2 2>/dev/null || true)"
          } >> "$REPORT/c2-seed.log"
          cat "$REPORT/c2-seed.log"

      - name: 'C2b: base parcheada en el cwd (exePath sin descargar)'
        continue-on-error: true
        run: |
          set -euo pipefail
          # El fuente era-Zig reutiliza un archivo YA presente en el directorio de
          # trabajo antes de tocar la red. Si esto funciona, la base se inyecta sin
          # env ni caché: el bundler prepara el cwd y bun compila sobre él.
          cd "$RUNNER_TEMP/spike"
          HOME_ISO="$RUNNER_TEMP/home-c2b"; rm -rf "$HOME_ISO"
          mkdir -p "$HOME_ISO/.bun/install/cache"
          install -m 0755 "$RUNNER_TEMP/base-elf" ./bun-linux-aarch64-android-v"${HOST_BUN_VERSION}"
          set +e
          HOME="$HOME_ISO" "$RUNNER_TEMP/bun" build --compile \
            --target=bun-linux-arm64-android hello.ts --outfile hello-c2b \
            > "$REPORT/c2b-seed.log" 2>&1
          echo "rc=$?" >> "$REPORT/c2b-seed.log"
          set -e
          {
            echo '--- linaje ---'
            ls -l hello-c2b 2>/dev/null || echo 'sin hello-c2b'
            echo "canary=$(grep -ac "$BUN_ANDROID_REVISION" hello-c2b 2>/dev/null || true)"
            echo "oficial=$(grep -ac '1.4.2+744846f84' hello-c2b 2>/dev/null || true)"
          } >> "$REPORT/c2b-seed.log"
          cat "$REPORT/c2b-seed.log"

      - name: 'C3: base parcheada via registry npm falso (HOME aislado)'
        continue-on-error: true
        run: |
          set -euo pipefail
          # Iteración 2: el log del servidor quedó vacío en la corrida 1 porque la
          # caché real ya tenía la base => bun no preguntó al registry. Con HOME
          # virgen la pregunta tiene que ocurrir; el nombre del paquete es el que
          # B leyó en su propio log: @oven/bun-linux-aarch64-android.
          cd "$RUNNER_TEMP/npm"
          PKG="@oven/bun-linux-aarch64-android"
          ENC="@oven%2fbun-linux-aarch64-android"
          TARBALL="bun-linux-aarch64-android-${HOST_BUN_VERSION}.tgz"
          rm -rf reg; mkdir -p "reg/$PKG/-" "reg/$ENC/-"
          cp package.tgz "reg/$PKG/-/$TARBALL"
          cp package.tgz "reg/$ENC/-/$TARBALL"
          META=$(python3 -c 'import json,sys;print(json.dumps({"name":sys.argv[1],"dist-tags":{"latest":sys.argv[2]},"versions":{sys.argv[2]:{"name":sys.argv[1],"version":sys.argv[2],"dist":{"tarball":f"http://127.0.0.1:8022/{sys.argv[3]}/-/{sys.argv[4]}"}}}}))' \
            "$PKG" "$HOST_BUN_VERSION" "$ENC" "$TARBALL")
          printf '%s' "$META" > "reg/$PKG/index.json"
          printf '%s' "$META" > "reg/$ENC/index.json"
          HOME_ISO="$RUNNER_TEMP/home-c3"; rm -rf "$HOME_ISO"; mkdir -p "$HOME_ISO/.bun/install/cache"
          cd "$RUNNER_TEMP/spike"
          python3 -m http.server 8022 --directory "$RUNNER_TEMP/npm/reg" > "$REPORT/c3-server.log" 2>&1 &
          SRV=$!; sleep 1
          set +e
          HOME="$HOME_ISO" BUN_CONFIG_REGISTRY="http://127.0.0.1:8022" \
            "$RUNNER_TEMP/bun" build --compile --target=bun-linux-arm64-android hello.ts \
            --outfile hello-c3 > "$REPORT/c3-build.log" 2>&1
          echo "rc=$?" >> "$REPORT/c3-build.log"
          set -e
          kill "$SRV" 2>/dev/null || true
          {
            echo '--- peticiones recibidas por el registry falso ---'
            cat "$REPORT/c3-server.log"
            echo '--- que dejo el HOME aislado ---'
            find "$HOME_ISO" -type f -printf '%p\t%s\n' | head -20
            echo '--- linaje ---'
            ls -l hello-c3 2>/dev/null || echo 'sin hello-c3'
            echo "canary=$(grep -ac "$BUN_ANDROID_REVISION" hello-c3 2>/dev/null || true)"
            echo "oficial=$(grep -ac '1.4.2+744846f84' hello-c3 2>/dev/null || true)"
          } >> "$REPORT/c3-build.log"
          cat "$REPORT/c3-build.log"

      - name: 'C4: qemu-user con linker bionic del NDK'
        continue-on-error: true
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/spike"
          : > "$REPORT/c4-qemu.txt"
          # El ELF pide /system/bin/linker64. qemu -L resuelve ese camino dentro
          # del sysroot, asi que se arma un sysroot ISO con la estructura que
          # espera bionic y se prueban los linker64 candidatos del runner.
          ls -d "$ANDROID_NDK_HOME" /usr/local/lib/android/sdk/ndk/* /opt/android-ndk* \
            /usr/aarch64-linux-android 2>/dev/null >> "$REPORT/c4-qemu.txt" || true
          find / -xdev -name 'linker64' -type f 2>/dev/null | head -10 >> "$REPORT/c4-qemu.txt" || true
          CAND="$(find / -xdev -name 'linker64' -type f -size +1M 2>/dev/null | head -1 || true)"
          SYSROOT=""
          if [ -n "$CAND" ]; then
            SYSROOT="$RUNNER_TEMP/sysroot-iso"
            mkdir -p "$SYSROOT/system/bin" "$SYSROOT/system/lib64" "$SYSROOT/system/lib"
            install -m 0755 "$CAND" "$SYSROOT/system/bin/linker64"
            echo "linker_candidato=$CAND" >> "$REPORT/c4-qemu.txt"
          fi
          echo "sysroot=${SYSROOT:-<ninguno>}" >> "$REPORT/c4-qemu.txt"
          test -n "$SYSROOT"
          qemu-aarch64-static -L "$SYSROOT" "$RUNNER_TEMP/base-elf" --version \
            >> "$REPORT/c4-qemu.txt" 2>&1 || echo "rc_qemu=$?" >> "$REPORT/c4-qemu.txt"
          # Variante con el libc.so del NDK montado como sysroot completo
          for S in "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/linux-x86_64/sysroot \
                   /usr/local/lib/android/sdk/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/sysroot \
                   /usr/aarch64-linux-android; do
            [ -d "$S" ] || continue
            echo "=== intento con sysroot=$S ===" >> "$REPORT/c4-qemu.txt"
            qemu-aarch64-static -L "$S" "$RUNNER_TEMP/base-elf" --version \
              >> "$REPORT/c4-qemu.txt" 2>&1 || echo "rc_qemu=$?" >> "$REPORT/c4-qemu.txt"
          done
          cat "$REPORT/c4-qemu.txt"

      # ── D: plegado de OpenTUI bajo target android ──────────────────
      - name: 'D: resolucion nativa de @opentui/core con platform=android'
        continue-on-error: true
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/opentui-spike"; mkdir -p "$WORK"; cd "$WORK"
          "$RUNNER_TEMP/bun" init -y >/dev/null 2>&1 || true
          "$RUNNER_TEMP/bun" add "@opentui/core@${OPENTUI_VERSION}" > "$REPORT/d-opentui.txt" 2>&1 \
            || echo "bun add rc!=0 (sin dep, el plegado no es concluyente)" >> "$REPORT/d-opentui.txt"
          test -d node_modules/@opentui/core
          cat > app.ts <<'TS'
          import { resolveNativeLibraryPath } from "@opentui/core/platform/runtime-assets.bun"
          console.log(resolveNativeLibraryPath())
          TS
          cat > app-min.ts <<'TS'
          import * as core from "@opentui/core"
          console.log(Object.keys(core).length)
          TS
          for SRC in app.ts app-min.ts; do
            OUT="folded-${SRC%.ts}-android"
            "$RUNNER_TEMP/bun" build --compile --target=bun-linux-arm64-android "$SRC" \
              --outfile "$OUT" > "build-$SRC.log" 2>&1 || echo "rc!=0 $SRC" >> "build-$SRC.log"
            [ -f "$OUT" ] || continue
            {
              echo "=== $OUT ==="
              echo "core-linux-x64=$(grep -ac 'core-linux-x64' "$OUT" || true)"
              echo "core-linux-arm64=$(grep -ac 'core-linux-arm64' "$OUT" || true)"
              echo "throw_no_soporte=$(grep -ac 'not supported on the current platform' "$OUT" || true)"
              echo "unsupported_asset_target=$(grep -ac 'Unsupported OpenTUI Node asset target' "$OUT" || true)"
            } >> "$REPORT/d-opentui.txt"
          done
          # Control: mismo build SIN target (runner linux-x64) para comparar el plegado
          "$RUNNER_TEMP/bun" build --compile app-min.ts --outfile folded-host \
            >> "$REPORT/d-opentui.txt" 2>&1 || true
          {
            echo "=== folded-host (control, sin --target) ==="
            echo "core-linux-x64=$(grep -ac 'core-linux-x64' folded-host || true)"
            echo "core-linux-arm64=$(grep -ac 'core-linux-arm64' folded-host || true)"
          } >> "$REPORT/d-opentui.txt"
          echo '--- fuentes de node-asset-target instaladas (guard que rechaza android) ---' >> "$REPORT/d-opentui.txt"
          sed -n '15,45p' node_modules/@opentui/core/dist/node-asset-target.js >> "$REPORT/d-opentui.txt" 2>/dev/null \
            || { find node_modules/@opentui/core -name '*asset-target*' 2>/dev/null | head -5 >> "$REPORT/d-opentui.txt" || true; }
          cat "$REPORT/d-opentui.txt"

      # ── D2/F: lo que necesita P3.1 para ser escribible ─────────────
      - name: 'D2: swap de bytes del slot arm64 — se embute en el standalone?'
        continue-on-error: true
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/opentui-spike"; cd "$WORK"
          : > "$REPORT/d2-slot-swap.txt"
          # Natives de todas las plataformas, como hace el lane real.
          "$RUNNER_TEMP/bun" install --os='*' --cpu='*' >> "$REPORT/d2-slot-swap.txt" 2>&1 || true
          ARM_DIR="$(find node_modules -type d -name 'core-linux-arm64' 2>/dev/null | head -1 || true)"
          echo "arm_dir=${ARM_DIR:-<no instalado>}" >> "$REPORT/d2-slot-swap.txt"
          test -n "$ARM_DIR"
          SO="$(find "$ARM_DIR" -name 'libopentui.so' | head -1)"
          echo "so=$SO $(stat -c%s "$SO")" >> "$REPORT/d2-slot-swap.txt"
          ls -l "$ARM_DIR" >> "$REPORT/d2-slot-swap.txt"
          # El entrypoint importa el slot SIN ramas de platform: si bun se niega a
          # embutir un native de otra arquitectura bajo --target android, esto lo
          # muestra (U8). Y si un dummy con canary queda en el binario, el swap del
          # .so Bionic va en ESTA ruta (decide el punto 6 de P3).
          printf 'import mod from "@opentui/core-linux-arm64";\nconsole.log(mod);\n' > slot.ts
          "$RUNNER_TEMP/bun" build --compile --target=bun-linux-arm64-android slot.ts \
            --outfile folded-slot >> "$REPORT/d2-slot-swap.txt" 2>&1 || echo "rc_real=$?" >> "$REPORT/d2-slot-swap.txt"
          {
            echo "=== folded-slot (so real) ==="
            ls -l folded-slot 2>/dev/null || echo 'sin folded-slot'
            echo "libopentui_hits=$(grep -ac 'libopentui' folded-slot 2>/dev/null || true)"
          } >> "$REPORT/d2-slot-swap.txt"
          CANARY="OPENTUI-SLOT-CANARY-${GITHUB_RUN_ID}"
          cp "$SO" "${SO}.host.bak"
          python3 -c 'import sys;open(sys.argv[1],"wb").write((sys.argv[2]+"\n").encode()*20000)' \
            "$SO" "$CANARY"
          echo "dummy_so=$(stat -c%s "$SO")" >> "$REPORT/d2-slot-swap.txt"
          "$RUNNER_TEMP/bun" build --compile --target=bun-linux-arm64-android slot.ts \
            --outfile folded-slot-dummy >> "$REPORT/d2-slot-swap.txt" 2>&1 || echo "rc_dummy=$?" >> "$REPORT/d2-slot-swap.txt"
          {
            echo "=== folded-slot-dummy (canary) ==="
            ls -l folded-slot-dummy 2>/dev/null || echo 'sin folded-slot-dummy'
            echo "canary=$(grep -ac "$CANARY" folded-slot-dummy 2>/dev/null || true)"
            echo "delta_vs_real=$(( $(stat -c%s folded-slot-dummy 2>/dev/null || echo 0) - $(stat -c%s folded-slot 2>/dev/null || echo 0) ))"
          } >> "$REPORT/d2-slot-swap.txt"
          mv "${SO}.host.bak" "$SO"
          cat "$REPORT/d2-slot-swap.txt"

      - name: 'F: control del DCE del target (por que la reescritura debe ser inmune)'
        continue-on-error: true
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/dce"; rm -rf "$WORK"; mkdir -p "$WORK/node_modules/ctlstub"
          cd "$WORK"
          # Aisla el mecanismo con stubs de 40 bytes en lugar de 90 MB de OpenTUI:
          # una rama process.platform se poda, un import incondicional sobrevive.
          printf '{"name":"ctlstub","version":"1.0.0","main":"i.js"}\n' > node_modules/ctlstub/package.json
          printf 'export default "DCE-CANARY-STUB";\n' > node_modules/ctlstub/i.js
          cat > branchy.ts <<'TS'
          if (process.platform === "linux" && process.arch === "x64") {
            const m = await import("ctlstub");
            console.log(m.default);
          }
          console.log("fin");
          TS
          cat > direct.ts <<'TS'
          const m = await import("ctlstub");
          console.log(m.default);
          TS
          {
            echo "# F: presencia del stub en el grafo (DCE-CANARY-STUB)"
            for SRC in branchy direct; do
              for TAG in android host; do
                if [ "$TAG" = android ]; then
                  "$RUNNER_TEMP/bun" build --compile --target=bun-linux-arm64-android "$SRC.ts" \
                    --outfile "out-$SRC-$TAG" > /dev/null 2>&1 || echo "rc!=0 $SRC $TAG"
                else
                  "$RUNNER_TEMP/bun" build --compile "$SRC.ts" --outfile "out-$SRC-$TAG" \
                    > /dev/null 2>&1 || echo "rc!=0 $SRC $TAG"
                fi
                printf '%s %-8s canario=%s tamano=%s\n' "$SRC" "$TAG" \
                  "$(grep -ac 'DCE-CANARY-STUB' "out-$SRC-$TAG" 2>/dev/null || true)" \
                  "$(stat -c%s "out-$SRC-$TAG" 2>/dev/null || echo 0)"
              done
            done
          } > "$REPORT/F-dce.txt" 2>&1
          cat "$REPORT/F-dce.txt"

      # ── E: re-export roto de undici en grafo 1.4.2 ─────────────────
      - name: 'E: scan advisory del patron de undici'
        continue-on-error: true
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/spike"
          # El patron que el trasplante era-Zig reparaba a nivel de bytes.
          python3 - <<'PY' > "$REPORT/E-undici.txt"
          import glob, os, re
          pat = re.compile(rb"__reExport\(exports_[A-Za-z0-9_]+,\s*([A-Za-z_][A-Za-z0-9_]*)\)")
          for f in sorted(glob.glob(os.environ["RUNNER_TEMP"] + "/spike/hello-*")
                          + glob.glob(os.environ["RUNNER_TEMP"] + "/opentui-spike/folded-*")):
              if not os.path.isfile(f):
                  continue
              data = open(f, "rb").read()
              hits = pat.findall(data)
              print(f, "tamano=%d" % len(data), "reExport_hits=%d" % len(hits),
                    "undici=%s" % (b"undici" in data))
          PY
          cat "$REPORT/E-undici.txt"

      - name: Veredictos de la sonda
        if: always()
        run: |
          set -euo pipefail
          {
            echo "# Veredictos B7 spike  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "- host bun: $(cat "$REPORT/a-host-revision.txt" 2>/dev/null || echo sin-dato)"
            echo "- sha256 bun-linux-x64.zip: $(awk '{print $1}' "$REPORT/a-host-sha.txt" 2>/dev/null || echo sin-dato)"
            echo
            for F in b-attempts c1-build c2-seed c2b-seed c3-build c4-qemu d-opentui d2-slot-swap F-dce E-undici c0-strip; do
              P="$(ls "$REPORT/$F.txt" "$REPORT/$F.log" 2>/dev/null | head -1 || true)"
              if [ -n "$P" ] && [ -s "$P" ]; then
                echo "## ${P##*/}"
                head -60 "$P"
                echo
              fi
            done
            echo "## Binarios producidos"
            find "$RUNNER_TEMP/spike" -maxdepth 1 -name 'hello-*' -printf '%f\t%s\n' 2>/dev/null || true
            find "$RUNNER_TEMP/opentui-spike" -maxdepth 1 -name 'folded-*' -printf '%f\t%s\n' 2>/dev/null || true
          } > "$RUNNER_TEMP/VERDICTS.md"
          cat "$RUNNER_TEMP/VERDICTS.md"

      - name: Subir reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b7-spike-report
          path: |
            ${{ runner.temp }}/report
            ${{ runner.temp }}/VERDICTS.md
          if-no-files-found: warn
          retention-days: 30

      - name: Subir probes ejecutables (para el telefono)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b7-spike-probes
          path: |
            ${{ runner.temp }}/spike/hello-c1
            ${{ runner.temp }}/spike/hello-c2
            ${{ runner.temp }}/spike/hello-c2b
            ${{ runner.temp }}/spike/hello-c3
            ${{ runner.temp }}/spike/hello-bun-linux-arm64-android
            ${{ runner.temp }}/opentui-spike/folded-app-min-android
            ${{ runner.temp }}/opentui-spike/folded-slot-dummy
          if-no-files-found: ignore
          retention-days: 14
