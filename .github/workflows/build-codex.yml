name: Build Codex (Android aarch64)

on:
  workflow_dispatch:
    inputs:
      codex_ref:
        description: 'Commit o tag de openai/codex'
        required: false
        default: '50ef7395faee1d0e2d01730f9636aa06091c7be3'
      v8_version:
        description: 'Versión de rusty_v8 compatible con codex-code-mode-host'
        required: false
        default: '150.4.0'
  workflow_call:
    inputs:
      codex_ref:
        type: string
        required: false
        default: '50ef7395faee1d0e2d01730f9636aa06091c7be3'
      v8_version:
        type: string
        required: false
        default: '150.4.0'
      use_existing_v8:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: build-codex-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_API: '24'
  ANDROID_NDK_VERSION: '28.1.13356709'
  WORK_DIR: '${{ github.workspace }}/codex/build'
  ANDROID_NDK_HOME: '${{ github.workspace }}/codex/build/android-ndk'

jobs:
  rusty-v8:
    if: ${{ !inputs.use_existing_v8 }}
    uses: ./.github/workflows/build-rusty-v8-android.yml
    with:
      v8_version: ${{ inputs.v8_version || '150.4.0' }}
    secrets: inherit

  build-codex:
    needs: rusty-v8
    if: always() && (inputs.use_existing_v8 || needs.rusty-v8.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Clone pinned Codex source
        env:
          CODEX_REF: ${{ inputs.codex_ref || '50ef7395faee1d0e2d01730f9636aa06091c7be3' }}
        run: |
          set -euo pipefail
          CODEX_SRC="$WORK_DIR/codex-src"
          rm -rf "$CODEX_SRC"
          git clone --filter=blob:none --no-checkout https://github.com/openai/codex.git "$CODEX_SRC"
          git -C "$CODEX_SRC" fetch --depth 1 origin "$CODEX_REF"
          git -C "$CODEX_SRC" checkout --detach FETCH_HEAD
          echo "CODEX_SRC=$CODEX_SRC" >> "$GITHUB_ENV"
          echo "CODEX_RESOLVED_COMMIT=$(git -C "$CODEX_SRC" rev-parse HEAD)" >> "$GITHUB_ENV"
          git -C "$CODEX_SRC" log -1 --oneline

      - name: Resolve Codex Rust toolchain and cache contract
        id: contract
        run: |
          set -euo pipefail
          RUST_TOOLCHAIN="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' "$CODEX_SRC/codex-rs/rust-toolchain.toml" | head -1)"
          test -n "$RUST_TOOLCHAIN"
          echo "RUST_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          export UPSTREAM_COMMIT="$CODEX_RESOLVED_COMMIT" RUST_TOOLCHAIN
          export ANDROID_TRIPLE_API="aarch64-linux-android${ANDROID_API}"
          args=(--root "$GITHUB_WORKSPACE" --product codex
            --path codex/scripts/build-codex-android.sh --path ci/scripts/env.sh
            --path codex/src/codex-rs/Cargo.lock
            --path codex/src/codex-rs/code-mode-host/build.rs
            --value "CODEX_REF=$CODEX_RESOLVED_COMMIT" --value "V8_VERSION=${{ inputs.v8_version || '150.4.0' }}")
          cache_key="$(python3 ci/scripts/cache-contract.py key "${args[@]}")"
          echo "key=$cache_key" >> "$GITHUB_OUTPUT"

      - name: Cache Codex Cargo dependencies
        id: cache-codex-dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.WORK_DIR }}/cache/cargo/registry
            ${{ env.WORK_DIR }}/cache/cargo/git
          key: ${{ steps.contract.outputs.key }}-dependencies

      - name: Cache Codex Cargo intermediates
        id: cache-codex-intermediates
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WORK_DIR }}/codex-target
          key: ${{ steps.contract.outputs.key }}-intermediates

      - name: Cache Codex compiler objects
        id: cache-codex-compiler
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WORK_DIR }}/sccache
          key: ${{ steps.contract.outputs.key }}-compiler

      - name: Download verified Rusty V8 artifact
        uses: actions/download-artifact@v4
        with:
          name: rusty-v8-${{ inputs.v8_version || '150.4.0' }}-ptrcomp-sandbox-aarch64-linux-android
          path: ${{ env.WORK_DIR }}/rusty-v8

      - name: Export Rusty V8 paths
        run: |
          set -euo pipefail
          ARCHIVE="$(find "$WORK_DIR/rusty-v8" -name 'librusty_v8_*.a.gz' -print -quit)"
          BINDING="$(find "$WORK_DIR/rusty-v8" -name 'src_binding_*.rs' -print -quit)"
          test -n "$ARCHIVE" && test -n "$BINDING"
          echo "RUSTY_V8_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "RUSTY_V8_SRC_BINDING_PATH=$BINDING" >> "$GITHUB_ENV"

      - name: Install build dependencies and NDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake perl pkg-config m4 zip unzip file protobuf-compiler
          source ci/scripts/setup-runner.sh

      - name: Enable zram swap
        uses: ./ci/actions/zram

      - name: Install Rust Android target
        working-directory: ${{ env.WORK_DIR }}/codex-src/codex-rs
        run: |
          set -euo pipefail
          RUST_TOOLCHAIN="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml | head -1)"
          test -n "$RUST_TOOLCHAIN"
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RUST_TOOLCHAIN" aarch64-linux-android
          rustup target list --installed --toolchain "$RUST_TOOLCHAIN" | grep -Fx aarch64-linux-android

      - name: Install sccache
        run: |
          set -euo pipefail
          SCCACHE_VERSION="v0.8.2"
          SCCACHE_PLATFORM="x86_64-unknown-linux-musl"
          curl -fsSL "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/sccache-${SCCACHE_VERSION}-${SCCACHE_PLATFORM}.tar.gz" -o "$RUNNER_TEMP/sccache.tar.gz"
          tar -xzf "$RUNNER_TEMP/sccache.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/sccache-${SCCACHE_VERSION}-${SCCACHE_PLATFORM}" >> "$GITHUB_PATH"
          echo "SCCACHE_DIR=${{ env.WORK_DIR }}/sccache" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Build Codex CLI and code-mode host
        run: source ci/scripts/env.sh && ./codex/scripts/build-codex-android.sh

      # Preserve useful Cargo/sccache work when the final linker fails.
      - name: Save Codex Cargo dependencies (best effort)
        if: always() && steps.cache-codex-dependencies.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.WORK_DIR }}/cache/cargo/registry
            ${{ env.WORK_DIR }}/cache/cargo/git
          key: ${{ steps.contract.outputs.key }}-dependencies

      - name: Save Codex Cargo intermediates (best effort)
        if: always() && steps.cache-codex-intermediates.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WORK_DIR }}/codex-target
          key: ${{ steps.contract.outputs.key }}-intermediates

      - name: Save Codex compiler objects (best effort)
        if: always() && steps.cache-codex-compiler.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WORK_DIR }}/sccache
          key: ${{ steps.contract.outputs.key }}-compiler

      - name: Upload Codex binaries
        uses: actions/upload-artifact@v4
        with:
          name: codex-android-aarch64-${{ inputs.codex_ref || '50ef7395faee1d0e2d01730f9636aa06091c7be3' }}
          path: |
            codex/artifacts/codex-android
            codex/artifacts/codex-code-mode-host
            codex/artifacts/codex-linux-sandbox
          if-no-files-found: error

      - name: Write CI summary
        if: always()
        env:
          CACHE_DEPENDENCIES: ${{ steps.cache-codex-dependencies.outputs.cache-hit == 'true' && 'hit' || 'miss' }}
          CACHE_INTERMEDIATES: ${{ steps.cache-codex-intermediates.outputs.cache-hit == 'true' && 'hit' || 'miss' }}
        run: source ci/scripts/ci-summary.sh && ci_summary
