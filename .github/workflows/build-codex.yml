# build-codex.yml
#
# Cross-compile de OpenAI Codex CLI (openai/codex, Rust) para Termux/Android
# aarch64 (bionic) en runner x86_64 (ubuntu-latest).
#
# A diferencia de build-opencode.yml NO requiere runner ARM64 nativo: cargo
# cross-compila puro contra el NDK (cargo build --release
# --target aarch64-linux-android). NO usa Bun/Zig/libopentui.
#
# Flujo:
#   1. Instala deps de build (build-essential/cmake/perl para openssl-sys
#      vendored, onig_sys y aws-lc-rs; protoc-bin-vendored descarga solo en
#      build-time y funciona en host linux).
#   2. Restaura del cache: toolchain Rust (codex-rust-*), registro/git y
#      package cache de cargo (codex-cargo-*), target incremental de Cargo
#      (codex-target-*), sccache y el NDK r28b recortado a aarch64.
#   3. Instala el NDK r28b solo si el cache falla y lo recorta a la ABI
#      aarch64 (ahorra ~2 GB).
#   4. scripts/build-codex-ci.sh: clona openai/codex al ref CODEX_REF (commit
#      o tag), aplica patches/codex/*.patch, instala la toolchain Rust del
#      rust-toolchain.toml y cross-compila codex-cli + codex-code-mode-host.
#   5. Empaqueta codex-v<version>-android-aarch64.zip, sube artifact y crea
#      Release cuando github.ref es tag v* o input release=true.
#
# CAMINO FÁCIL DE UPGRADE: cambiar el ref en scripts/env.sh (CODEX_REF) o el
# input codex_ref (commit/tag) → la cache key de cargo
# (codex-cargo-<ref>-<patch hashes>) cambia automáticamente → cache miss →
# rebuild. Nada más que tocar.
#
# NOTA: el binario DENTRO del zip se llama `codex-android` (el script lo copia
# con ese nombre); el comando de instalación del release lo renombra a `codex`.

name: Build Codex (Android aarch64)

on:
  workflow_dispatch:
    inputs:
      codex_ref:
        description: 'Commit sha (40 hex) o tag de openai/codex a portar'
        required: false
        default: '50ef7395faee1d0e2d01730f9636aa06091c7be3'
      codex_version:
        description: 'Versión para el asset (default: 0.134.0-alpha.3; si vacío se deriva del tag/sha del checkout)'
        required: false
        default: '0.134.0-alpha.3'
      release:
        description: 'Publicar Release con el asset'
        required: false
        type: boolean
        default: false
      bins:
        description: 'Binarios útiles a compilar/empaquetar (espacios; default: codex codex-code-mode-host)'
        required: false
        type: string
        default: 'codex codex-code-mode-host'
  push:
    tags:
      - 'codex-v*'

permissions:
  contents: write

concurrency:
  group: build-codex-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_HOME: /opt/android-ndk

jobs:
  build-codex:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # ── Dependencias de build ──
      # openssl-sys vendored necesita perl/make; onig_sys es C puro; aws-lc-rs
      # necesita cmake; protobuf-compiler es OBLIGATORIO: el build.rs de
      # code-mode-protocol usa #[cfg(target_os = "android")] (el cfg refleja el
      # TARGET, no el host) → en CI (target=android) protoc-bin-vendored NO se
      # usa y se necesita `protoc` real en PATH. file se usa en la verificación
      # del binario en el script; unzip es para el NDK r28b (instalado abajo).
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake perl pkg-config m4 zip unzip file protobuf-compiler

      # ── Cache: toolchain Rust (1.95.0 del rust-toolchain.toml) ──
      # Si cambia el channel de codex-rs/rust-toolchain.toml, actualizar la key.
      - name: Cache Rust toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/downloads
            ~/.rustup/update-hashes
          key: codex-rust-1.95.0-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            codex-rust-1.95.0-${{ runner.os }}-

      # ── Cache: registro + git de cargo (por ref + hashes de los parches) ──
      # La key incluye el ref (commit/tag) y el hash de patches/codex/*.patch:
      # cualquier cambio de ref o de parches invalida el cache automáticamente.
      # En eventos push inputs.codex_ref es vacío → fallback al pin por defecto.
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/.package-cache
          key: codex-cargo-${{ inputs.codex_ref || '50ef7395faee1d0e2d01730f9636aa06091c7be3' }}-${{ hashFiles('patches/codex/*.patch') }}
          restore-keys: |
            codex-cargo-${{ inputs.codex_ref || '50ef7395faee1d0e2d01730f9636aa06091c7be3' }}-
          # Conserva registry parcialmente poblado aunque la compilación falle.
          save-always: true

      # ── Cache: NDK r28b recortado a aarch64 ──
      # actions/cache restaura/escribe como el usuario runner: /opt no es
      # escribible sin sudo, así que se prepara el dir con chown antes.
      - name: Prepare NDK directory
        run: |
          sudo mkdir -p "$ANDROID_NDK_HOME"
          sudo chown -R "$(id -u):$(id -g)" "$ANDROID_NDK_HOME"

      - name: Cache Android NDK r28b
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /opt/android-ndk
          key: codex-ndk-r28b

      # ── Instalar NDK r28b ──
      # Solo si el cache no lo restauró. Guard interno con test -d (el cache
      # podría restaurar la estructura de otra key vía prefix fallback).
      # Se RECORTA a la ABI aarch64: se borra todo lo que no sea
      # aarch64-linux-android* en sysroot/usr/lib y las platforms no-arm64.
      - name: Install Android NDK r28b (trimmed to aarch64)
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          if [ -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android-clang" ]; then
            echo ">>> NDK ya presente, skip"
            exit 0
          fi
          echo ">>> Descargando android-ndk-r28b..."
          curl -fsSL "https://dl.google.com/android/repository/android-ndk-r28b-linux.zip" \
            -o "$RUNNER_TEMP/ndk.zip"
          mkdir -p "$RUNNER_TEMP/ndk-extract"
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP/ndk-extract"
          sudo mv "$RUNNER_TEMP/ndk-extract/android-ndk-r28b"/* "$ANDROID_NDK_HOME/"
          rm -rf "$RUNNER_TEMP/ndk.zip" "$RUNNER_TEMP/ndk-extract"

          # ── Recorte de ABIs (solo aarch64) ──
          SYSROOT_LIB="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib"
          for triple in "$SYSROOT_LIB"/*/; do
            case "$triple" in
              */aarch64-linux-android*/) ;;   # conservar
              *) sudo rm -rf "$triple";;
            esac
          done
          # platforms/: conservar solo arch-arm64
          for arch_dir in "$ANDROID_NDK_HOME"/platforms/android-*/arch-*/; do
            case "$arch_dir" in
              */arch-arm64/) ;;               # conservar
              *) sudo rm -rf "$arch_dir";;
            esac
          done

          # ── Validación: clang aarch64 (con o sin sufijo API) ──
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          if [ -x "$NDK_BIN/aarch64-linux-android-clang" ]; then
            echo ">>> NDK OK: aarch64-linux-android-clang"
          elif [ -x "$NDK_BIN/aarch64-linux-android24-clang" ]; then
            echo ">>> NDK OK: aarch64-linux-android24-clang (el script creará el symlink sin sufijo)"
          else
            echo "ERROR: clang aarch64 no encontrado en $NDK_BIN" >&2
            exit 1
          fi

      # ── sccache (release binario de mozilla, patrón de build-rusty-v8-android.yml) ──
      # Cache de compilación de cargo en CI: evita recompilar crates de codex
      # (codex-core es el más caro) cuando el input `bins` pide solo el host
      # (codex-code-mode-host) o cuando cambia un parche. SCCACHE_DIR va DENTRO
      # del checkout para incluirlo en el cache key.
      - name: Install sccache
        run: |
          set -euo pipefail
          SCCACHE_VERSION="v0.8.2"
          SCCACHE_PLATFORM="x86_64-unknown-linux-musl"
          curl -fsSL "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/sccache-${SCCACHE_VERSION}-${SCCACHE_PLATFORM}.tar.gz" \
            -o "$RUNNER_TEMP/sccache.tar.gz"
          tar -xzf "$RUNNER_TEMP/sccache.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/sccache-${SCCACHE_VERSION}-${SCCACHE_PLATFORM}" >> "$GITHUB_PATH"
          echo "SCCACHE_DIR=${{ github.workspace }}/.sccache-codex" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      # ── Cache de sccache (key por ref + hashes de los parches) ──
      # El Cargo.lock de codex vive DENTRO del checkout que el build script clona
      # en build/codex-ci/codex (no disponible para hashFiles en el workflow) →
      # la key usa el ref + patches: el ref pinnea el lockfile y los parches
      # invalidan cuando cambian.
      - name: Cache sccache (codex build)
        uses: actions/cache@v4
        with:
          path: .sccache-codex
          key: codex-sccache-${{ inputs.codex_ref || '50ef7395faee1d0e2d01730f9636aa06091c7be3' }}-${{ hashFiles('patches/codex/*.patch') }}
          restore-keys: |
            codex-sccache-${{ inputs.codex_ref || '50ef7395faee1d0e2d01730f9636aa06091c7be3' }}-
          # Permite que un fallo posterior conserve objetos ya compilados.
          save-always: true

      # ── Cache: target Cargo (fingerprints y artefactos reutilizables) ──
      # El script usa CARGO_TARGET_DIR=build/codex-ci/target. Se restaura
      # aunque cambie un parche: Cargo verifica fingerprints contra el nuevo
      # checkout y conserva los crates/artifacts que siguen siendo válidos.
      # El target se separa del checkout clonado para que actions/cache pueda
      # restaurarlo antes de que el helper prepare la fuente.
      - name: Cache Cargo target and incremental state
        uses: actions/cache@v4
        with:
          path: build/codex-ci/target
          # content-mtime-v2 corresponds to the file + directory deterministic
          # mtime scheme in codex-prepare-source.sh. It is intentionally
          # separate from the v1 per-file-only targets.
          key: codex-target-content-mtime-v2-${{ inputs.codex_ref || '50ef7395faee1d0e2d01730f9636aa06091c7be3' }}-rust1.95.0-ndk28b-${{ hashFiles('patches/codex/*.patch') }}
          # Migración de una sola vez: si todavía no existe la clave
          # content-mtime-v2 es la única clave primaria válida para el esquema
          # actual; las anteriores solo sirven para migrar una vez.
          restore-keys: |
            codex-target-content-mtime-v2-${{ inputs.codex_ref || '50ef7395faee1d0e2d01730f9636aa06091c7be3' }}-rust1.95.0-ndk28b-
            codex-target-content-mtime-v1-${{ inputs.codex_ref || '50ef7395faee1d0e2d01730f9636aa06091c7be3' }}-rust1.95.0-ndk28b-
            codex-target-mtime-v2-${{ inputs.codex_ref || '50ef7395faee1d0e2d01730f9636aa06091c7be3' }}-rust1.95.0-ndk28b-
            codex-target-${{ inputs.codex_ref || '50ef7395faee1d0e2d01730f9636aa06091c7be3' }}-rust1.95.0-ndk28b-
          # Guarda fingerprints y artefactos parciales para el siguiente intento.
          save-always: true

      # El par rusty_v8 se verifica con su manifest antes de usarse. Cachearlo
      # evita repetir la descarga cuando solo cambian scripts/parches de Codex.
      - name: Cache verified rusty_v8 release pair
        uses: actions/cache@v4
        with:
          path: build/codex-ci/rusty-v8
          key: codex-rusty-v8-${{ hashFiles('scripts/env.sh') }}

      # ── Cross-compilar Codex (scripts/build-codex-ci.sh) ──
      # El script clona openai/codex@$CODEX_REF, aplica patches/codex/*.patch,
      # instala la toolchain Rust del rust-toolchain.toml y compila
      # codex-cli + codex-code-mode-host → $WORK_DIR y el zip
      # + codex-v<version>-android-aarch64.zip. Emite version= a GITHUB_OUTPUT
      # (el prefijo 'v' se quita en la normalización del script).
      - name: Cross-compile Codex
        id: build
        env:
          CODEX_REF: ${{ inputs.codex_ref }}
          # En push de tag codex-v* inputs.codex_version es vacío → se usa
          # github.ref_name (p.ej. codex-v0.134.0-alpha.3); el script normaliza
          # quitando el prefijo codex-v → 0.134.0-alpha.3.
          CODEX_VERSION: ${{ inputs.codex_version || github.ref_name }}
          # Binarios a compilar/empaquetar (input `bins`; vacío en push de tag →
          # el script aplica su default de CLI + code-mode-host).
          CODEX_BINS: ${{ inputs.bins }}
          JOBS: '2'
          ANDROID_NDK_HOME: /opt/android-ndk
          SCCACHE_IDLE_TIMEOUT: '0'
        run: |
          bash scripts/build-codex-ci.sh

      # ── Subir artifact ──
      # El zip vive en el WORK_DIR default del script: $REPO_ROOT/build/codex-ci
      # (REPO_ROOT = workspace). Nombre real: codex-v<version>-android-aarch64.zip.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-android-aarch64-${{ steps.build.outputs.version }}
          path: ${{ github.workspace }}/build/codex-ci/${{ steps.build.outputs.zip_name }}
          if-no-files-found: error

      # ── Release (tag codex-v* o input release=true) ──
      # Con tag codex-v* la release se crea como v$VERSION (no github.ref_name,
      # que sería codex-v0.134.0-alpha.3), así el tag de la release es el mismo
      # formato que el nombre del asset y no el de los tags v* de opencode.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/codex-v') || github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ format('v{0}', steps.build.outputs.version) }}
          files: ${{ github.workspace }}/build/codex-ci/${{ steps.build.outputs.zip_name }}
          body: |
            ## Codex CLI ${{ steps.build.outputs.version }} for Android/Termux (aarch64)

            Cross-compilado desde [openai/codex](https://github.com/openai/codex)
            (Rust puro, sin Bun/Zig) contra bionic del Android NDK r28b en
            runner x86_64.

            | Campo | Valor |
            |-------|-------|
            | Crate | `codex` (openai/codex @ `${{ inputs.codex_ref || '50ef7395faee1d0e2d01730f9636aa06091c7be3' }}`) |
            | Target | `aarch64-linux-android` (API 24, bionic) |
            | Toolchain | Rust `1.95.0` (`codex-rs/rust-toolchain.toml`) |
            | Asset | `codex-v${{ steps.build.outputs.version }}-android-aarch64.zip` |

            ### Instalación

            El ZIP contiene los binarios solicitados: `${{ steps.build.outputs.bins }}`.
            En la configuración normal son `codex` (publicado como
            `codex-android`) y `codex-code-mode-host` (runtime companion con V8
            embebido). Instala ambos en `$PREFIX/bin` y renombra
            `codex-android` a `codex`:

            ```bash
            unzip codex-v${{ steps.build.outputs.version }}-android-aarch64.zip -d "$PREFIX/bin"
            mv "$PREFIX/bin/codex-android" "$PREFIX/bin/codex"
            chmod +x "$PREFIX/bin/codex" "$PREFIX/bin/codex-code-mode-host"
            codex --version
            ```

            `codex-code-mode-host` usa el libc++ ESTÁTICO de V8 embebido
            (feature `use_custom_libcxx` del crate v8) → NO debería requerir
            `libc++_shared.so`. Verifícalo con:

            ```bash
            readelf -d "$PREFIX/bin/codex-code-mode-host" | grep NEEDED
            ```

            Si apareciera `libc++_shared.so`, instala el paquete Termux `libc++`
            (`pkg install libc++`).

            > Si usas un emulador/versión distinta o quieres el port local,
            > revisa `codex_build.sh` (build Termux) y `patches/codex/README.md`.
          draft: false
          prerelease: false
