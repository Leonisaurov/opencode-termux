name: Build OpenCode (final assembly)

on:
  workflow_dispatch:
    inputs:
      opentui_ref:
        description: 'Commit, tag o branch de OpenTUI'
        required: false
        default: '31a93fbe66992298d6d0f27481fa781f43d0c1e2'
      opencode_version:
        description: 'OpenCode version to build'
        required: false
        default: '2.0.24'
  workflow_call:
    inputs:
      opentui_ref:
        description: 'Commit, tag o branch de OpenTUI'
        required: false
        type: string
        default: '31a93fbe66992298d6d0f27481fa781f43d0c1e2'
      opencode_version:
        description: 'Versión de OpenCode'
        required: false
        type: string
        default: '2.0.24'
      require_dependency_artifacts:
        description: 'Falla si faltan artifacts producidos por el DAG caller'
        required: false
        type: boolean
        default: false

concurrency:
  group: build-opencode-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PRODUCT: opencode
  # Bun is not a product of this lane anymore: the emitter and the Android base
  # are pinned by ci/external-sources.lock and read from it by ci/scripts/env.sh
  # (BUN_ANDROID_*/OPENCODE_BUN_EMITTER_*). The era-Zig 1.2.13 build stays for
  # Kilo, whose lane keeps HOST_BUN_VERSION = 1.3.2.
  OPENTUI_REF: "${{ inputs.opentui_ref || '31a93fbe66992298d6d0f27481fa781f43d0c1e2' }}"
  OPENCODE_VERSION: "${{ inputs.opencode_version || '2.0.24' }}"
  ANDROID_API: "24"
  ANDROID_NDK_VERSION: "28.1.13356709"
  # Zig is only used here by the OpenTUI rebuild fallback, so it tracks the
  # version that build-opentui.yml pins. ICU and tinycc belonged to the
  # era-Zig core/bun jobs this lane no longer produces keys for.
  ZIG_VERSION: "0.16.0"
  WORK_DIR: "${{ github.workspace }}/opencode/build"
  ANDROID_NDK_HOME: "${{ github.workspace }}/.ci/android-ndk"
  ANDROID_NDK_ROOT: "${{ github.workspace }}/.ci/android-ndk"

jobs:
  build-opencode:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate downstream bundle contracts
        run: python3 ci/scripts/test-downstream-bundle-contracts.py

      - name: Create work directory
        run: mkdir -p "$WORK_DIR"

      - name: Compute OpenCode cache contract
        id: contract
        env:
          OPENTUI_COMMIT: ${{ env.OPENTUI_REF }}
        run: |
          set -euo pipefail
          # The Bun pins (emitter and Android base) come from the lock, not from
          # this file, so the cache key follows ci/external-sources.lock.
          source ci/scripts/env.sh > /dev/null
          opencode_source_commit="$(git ls-tree HEAD opencode/src | awk '{print $3}')"
          opentui_source_tree="$(git ls-tree HEAD opentui/src/opencode | awk '{print $3}')"
          test -n "$opencode_source_commit" && test -n "$opentui_source_tree"
          export ANDROID_TRIPLE_API="aarch64-linux-android${ANDROID_API}"
          opentui_args=(--root "$GITHUB_WORKSPACE" --product opentui
            --path opentui/scripts/build-opentui.sh --path ci/scripts/env.sh
            --path .github/workflows/build-opentui.yml
            --value "OPENTUI_REF=$OPENTUI_REF"
            --value "OPENTUI_TARGET=aarch64-linux-android.24"
            --value "OPENTUI_SOURCE_TREE=$opentui_source_tree")
          opentui_key="$(UPSTREAM_COMMIT="$OPENTUI_COMMIT" python3 ci/scripts/cache-contract.py key "${opentui_args[@]}")"
          echo "opentui=$opentui_key" >> "$GITHUB_OUTPUT"
          args=(--root "$GITHUB_WORKSPACE" --product opencode
            --path opencode/scripts/build-opencode.sh --path opencode/scripts/build-opencode-android.ts
            --path ci/scripts/materialize-bun-base.sh --path ci/scripts/validate-android-bundle-142.py
            --path ci/scripts/patch-opentui-core-runtime.py
            --path ci/external-sources.lock
            --path opencode/scripts/make-packages.sh
            --path ci/scripts/env.sh --path .github/workflows/build-opencode.yml
            --value "OPENCODE_VERSION=$OPENCODE_VERSION"
            --value "BUN_EMITTER_VERSION=$OPENCODE_BUN_EMITTER_VERSION"
            --value "BUN_ANDROID_SHA256=$BUN_ANDROID_SHA256"
            --value "OPENTUI_REF=$OPENTUI_REF"
            --value "OPENCODE_SOURCE_COMMIT=$opencode_source_commit"
            --value "OPENTUI_CACHE_KEY=$opentui_key")
          opencode_key="$(UPSTREAM_COMMIT="$OPENTUI_COMMIT" python3 ci/scripts/cache-contract.py key "${args[@]}")"
          echo "key=$opencode_key" >> "$GITHUB_OUTPUT"

      - name: Restore OpenCode source and product state
        id: cache-opencode-product
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ github.workspace }}/opencode/src
            ${{ env.WORK_DIR }}/dist/opencode
            ${{ env.WORK_DIR }}/state/nodes/opencode.json
          key: ${{ steps.contract.outputs.key }}-artifact

      - name: Validate OpenCode product cache
        id: validate-opencode
        run: |
          set -euo pipefail
          LIBOPENTUI="$GITHUB_WORKSPACE/opentui/src/opencode/packages/native/lib/aarch64-linux-android.24/libopentui.so"
          if test -s "${WORK_DIR}/dist/opencode" \
             && test "$(readelf -h "${WORK_DIR}/dist/opencode" | sed -n 's/^ *Class: *//p')" = ELF64 \
             && test "$(readelf -h "${WORK_DIR}/dist/opencode" | sed -n 's/^ *Machine: *//p')" = AArch64 \
             && python3 ci/scripts/validate-android-bundle-142.py "${WORK_DIR}/dist/opencode" \
                  --lib "$LIBOPENTUI" >/dev/null 2>&1 \
             && python3 ci/scripts/build-state.py verify --root "$GITHUB_WORKSPACE" \
                  --state-dir "$WORK_DIR/state" --node opencode >/dev/null 2>&1; then
            echo ready=true >> "$GITHUB_OUTPUT"
          else
            echo ready=false >> "$GITHUB_OUTPUT"
          fi

      # Restore the OpenTUI fallback caches before the per-attempt checkpoint.
      # Source and output use exact producer keys; Zig state may come from the
      # producer's stable compatibility prefix. The checkpoint is applied
      # after these layers so the newest partial build always wins.
      - name: Cache OpenTUI source fallback
        if: steps.validate-opencode.outputs.ready != 'true' && !inputs.require_dependency_artifacts
        id: cache-opentui-source
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/opentui/src/opencode
          key: ${{ steps.contract.outputs.opentui }}-source

      - name: Cache OpenTUI Zig intermediates fallback
        if: steps.validate-opencode.outputs.ready != 'true' && !inputs.require_dependency_artifacts
        id: cache-opentui-zig
        uses: ./ci/actions/incremental-cache
        with:
          mode: restore-intermediate
          key: ci-cache-v2-opentui-intermediates-${{ runner.os }}-${{ runner.arch }}-commit-${{ env.OPENTUI_REF }}-target-aarch64-linux-android.24-zig-${{ env.ZIG_VERSION }}-ndk-${{ env.ANDROID_NDK_VERSION }}-${{ steps.contract.outputs.opentui }}
          restore-prefix: ci-cache-v2-opentui-intermediates-${{ runner.os }}-${{ runner.arch }}-commit-${{ env.OPENTUI_REF }}-target-aarch64-linux-android.24-zig-${{ env.ZIG_VERSION }}-ndk-${{ env.ANDROID_NDK_VERSION }}-
          path: |
            ${{ github.workspace }}/opentui/build/cache/zig-opentui
            ${{ github.workspace }}/opentui/build/cache/zig-global

      - name: Cache OpenTUI build fallback
        if: steps.validate-opencode.outputs.ready != 'true' && !inputs.require_dependency_artifacts
        id: cache-opentui
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ github.workspace }}/opentui/src/opencode/packages/native/lib
            ${{ github.workspace }}/opentui/build/state/nodes/opentui.json
          key: ${{ steps.contract.outputs.opentui }}-artifact

      - name: Restore OpenCode resumable checkpoint
        if: steps.cache-opencode-product.outputs.cache-hit != 'true' || steps.validate-opencode.outputs.ready != 'true'
        uses: ./ci/actions/incremental-cache
        with:
          mode: restore-checkpoint
          checkpoint-prefix: ci-cache-v2-recovery-opencode-${{ runner.os }}-${{ runner.arch }}-version-${{ env.OPENCODE_VERSION }}-bun142-${{ hashFiles('ci/external-sources.lock') }}-opentui-${{ env.OPENTUI_REF }}-api-${{ env.ANDROID_API }}-ndk-${{ env.ANDROID_NDK_VERSION }}-source-${{ hashFiles('ci/source-manifest.json', 'opencode/src/package.json', 'opencode/src/bun.lock') }}-
          checkpoint-path: |
            ${{ github.workspace }}/opencode/src
            ${{ env.WORK_DIR }}
            ${{ github.workspace }}/opentui/src/opencode/packages/native/lib
            ${{ github.workspace }}/opentui/build
            ~/.bun

      # ── Restore cached toolchain ──────────────────────────────
      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.ANDROID_NDK_HOME }}
          key: ci-cache-v2-toolchain-${{ runner.os }}-${{ runner.arch }}-ndk-${{ env.ANDROID_NDK_VERSION }}-api-${{ env.ANDROID_API }}

      - name: Cache Zig
        id: cache-zig
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ci/zig-${{ env.ZIG_VERSION }}
          key: ci-cache-v2-toolchain-${{ runner.os }}-${{ runner.arch }}-zig-${{ env.ZIG_VERSION }}-api-${{ env.ANDROID_API }}

      - name: Ensure host Bun emitter is available
        id: host-bun
        run: |
          set -euo pipefail
          source ci/scripts/env.sh > /dev/null
          if [ ! -x "$HOME/.bun/bin/bun" ] \
             || [ "$("$HOME/.bun/bin/bun" --version 2>/dev/null || true)" != "$OPENCODE_BUN_EMITTER_VERSION" ]; then
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/bun-host.zip" "$OPENCODE_BUN_EMITTER_URL"
            echo "$OPENCODE_BUN_EMITTER_SHA256  $RUNNER_TEMP/bun-host.zip" | sha256sum -c -
            unzip -q -o "$RUNNER_TEMP/bun-host.zip" -d "$RUNNER_TEMP/bun-host"
            mkdir -p "$HOME/.bun/bin"
            install -m 0755 "$RUNNER_TEMP/bun-host/bun-linux-x64/bun" "$HOME/.bun/bin/bun"
          fi
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          echo "BUN_INSTALL=$HOME/.bun" >> "$GITHUB_ENV"
          export PATH="$HOME/.bun/bin:$PATH"
          test "$(bun --version)" = "$OPENCODE_BUN_EMITTER_VERSION"
          echo ready=true >> "$GITHUB_OUTPUT"

      - name: Receive OpenTUI artifact
        if: steps.validate-opencode.outputs.ready != 'true'
        uses: actions/download-artifact@v4
        continue-on-error: ${{ !inputs.require_dependency_artifacts }}
        with:
          # build-opentui resolves branches/tags to an immutable commit, so
          # the producer's artifact suffix is intentionally not the raw input.
          pattern: opentui-android-aarch64-*
          merge-multiple: true
          path: ${{ env.WORK_DIR }}/artifact-opentui

      - name: Materialize OpenTUI artifact
        if: steps.validate-opencode.outputs.ready != 'true'
        run: |
          set -euo pipefail
          EXPECTED_COMMIT="${{ env.OPENTUI_REF }}"
          LIB="$(find "$WORK_DIR/artifact-opentui" -type f -name libopentui.so -print -quit 2>/dev/null || true)"
          INFO="$(find "$WORK_DIR/artifact-opentui" -type f -name build-info.txt -print -quit 2>/dev/null || true)"
          valid=false
          if [ -n "$LIB" ] && [ -n "$INFO" ] \
             && grep -Fxq "opentui_commit=$EXPECTED_COMMIT" "$INFO" \
             && test "$(readelf -h "$LIB" | sed -n 's/^ *Class: *//p')" = ELF64 \
             && test "$(readelf -h "$LIB" | sed -n 's/^ *Machine: *//p')" = AArch64 \
             && readelf -d "$LIB" | grep -q 'NEEDED.*libc.so'; then
            valid=true
          fi
          if [ "$valid" != true ]; then
            if [ "${{ inputs.require_dependency_artifacts }}" = "true" ]; then
              echo "Required OpenTUI artifact is missing, stale, or malformed (expected $EXPECTED_COMMIT)." >&2
              exit 1
            fi
            echo 'OpenTUI artifact is absent/stale; the local dependency cache or build will provide it.'
          else
            DEST="$GITHUB_WORKSPACE/opentui/src/opencode/packages/native/lib/aarch64-linux-android.24"
            mkdir -p "$DEST"
            install -m 0755 "$LIB" "$DEST/libopentui.so"
          fi

      # ── Restore Bun binary (required — run build-bun first) ──
      # The cross-compile base replaces the Bun artifact this lane used to
      # consume: it is downloaded from the Leonisaurov/bun-android release,
      # stripped and seeded into the emitter's fetch cache by the shared script,
      # which is also what build-opencode.sh calls before registering its node.
      - name: Materialize Bun Android base
        if: steps.validate-opencode.outputs.ready != 'true'
        run: |
          set -euo pipefail
          BASE="$(bash ci/scripts/materialize-bun-base.sh)"
          test -s "$BASE"
          python3 ci/scripts/validate-android-bundle-142.py "$BASE"

      # Restore all remaining tools before paying for runner setup.
      - name: Install build dependencies
        if: steps.validate-opencode.outputs.ready != 'true'
        run: |
          # setup-runner installs the era-Zig host (1.3.2) by default; this lane
          # already pinned the 1.4.2 emitter, so hand it that version so it does
          # not download and overwrite the emitter with the wrong Bun.
          source ci/scripts/env.sh > /dev/null
          export HOST_BUN_VERSION="$OPENCODE_BUN_EMITTER_VERSION"
          source ci/scripts/setup-runner.sh

      # ── Build libopentui.so ───────────────────────────────────
      - name: Build libopentui.so
        if: steps.validate-opencode.outputs.ready != 'true' && !inputs.require_dependency_artifacts
        env:
          PRODUCT: opentui
          WORK_DIR: ${{ github.workspace }}/opentui/build
          BUILD_STATE_DIR: ${{ github.workspace }}/opentui/build/state
        run: |
          source ci/scripts/env.sh
          ./opentui/scripts/build-opentui.sh

      - name: Validate OpenTUI prerequisite
        if: always()
        id: validate-opentui
        run: |
          set -euo pipefail
          LIB="$GITHUB_WORKSPACE/opentui/src/opencode/packages/native/lib/aarch64-linux-android.24/libopentui.so"
          open_tui=false
          if test -s "$LIB" \
             && test "$(readelf -h "$LIB" | sed -n 's/^ *Class: *//p')" = ELF64 \
             && test "$(readelf -h "$LIB" | sed -n 's/^ *Machine: *//p')" = AArch64 \
             && readelf -d "$LIB" | grep -q 'NEEDED.*libc.so'; then
            open_tui=true
          fi
          if [ "${{ steps.validate-opencode.outputs.ready }}" = true ] || [ "$open_tui" = true ]; then
            echo ready=true >> "$GITHUB_OUTPUT"
            echo "cache_ready=$open_tui" >> "$GITHUB_OUTPUT"
          else
            echo ready=false >> "$GITHUB_OUTPUT"
            echo cache_ready=false >> "$GITHUB_OUTPUT"
            echo 'OpenTUI prerequisite is unavailable or malformed.' >&2
            exit 1
          fi

      # ── Build OpenCode + packages ─────────────────────────────
      - name: Build OpenCode standalone binary
        if: steps.validate-opencode.outputs.ready != 'true'
        run: |
          source ci/scripts/env.sh && ./opencode/scripts/build-opencode.sh

      - name: Verify OpenCode binary
        run: |
          set -euo pipefail
          OPENCODE_BINARY="${WORK_DIR}/dist/opencode"
          ls -lh "$OPENCODE_BINARY"
          file "$OPENCODE_BINARY"
          readelf -h "$OPENCODE_BINARY" | grep -E "Machine|Class"

      - name: Validate OpenCode outputs for durable cache
        if: always()
        id: final-opencode
        run: |
          set -euo pipefail
          BINARY="${WORK_DIR}/dist/opencode"
          LIBOPENTUI="$GITHUB_WORKSPACE/opentui/src/opencode/packages/native/lib/aarch64-linux-android.24/libopentui.so"
          ready=false
          if test -s "$BINARY" \
             && python3 ci/scripts/build-state.py verify --root "$GITHUB_WORKSPACE" \
                  --state-dir "$WORK_DIR/state" --node opencode >/dev/null 2>&1 \
             && python3 ci/scripts/validate-android-bundle-142.py "$BINARY" --lib "$LIBOPENTUI"; then
            ready=true
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" != true ]; then
            echo "ERROR: OpenCode output or state manifest is not valid." >&2
            exit 1
          fi

      - name: Save OpenTUI fallback cache
        if: always() && !inputs.require_dependency_artifacts && steps.validate-opentui.outputs.cache_ready == 'true' && steps.cache-opentui.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: ./ci/actions/incremental-cache
        with:
          mode: save-final
          path: |
            ${{ github.workspace }}/opentui/src/opencode/packages/native/lib
            ${{ github.workspace }}/opentui/build/state/nodes/opentui.json
          key: ${{ steps.contract.outputs.opentui }}-artifact

      - name: Save OpenTUI source fallback cache
        if: always() && !inputs.require_dependency_artifacts && steps.validate-opentui.outputs.cache_ready == 'true' && steps.cache-opentui-source.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: ./ci/actions/incremental-cache
        with:
          mode: save-final
          path: ${{ github.workspace }}/opentui/src/opencode
          key: ${{ steps.contract.outputs.opentui }}-source

      - name: Save OpenTUI Zig fallback cache
        if: always() && !inputs.require_dependency_artifacts && steps.validate-opentui.outputs.cache_ready == 'true' && steps.cache-opentui-zig.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: ./ci/actions/incremental-cache
        with:
          mode: save-intermediate
          path: |
            ${{ github.workspace }}/opentui/build/cache/zig-opentui
            ${{ github.workspace }}/opentui/build/cache/zig-global
          key: ci-cache-v2-opentui-intermediates-${{ runner.os }}-${{ runner.arch }}-commit-${{ env.OPENTUI_REF }}-target-aarch64-linux-android.24-zig-${{ env.ZIG_VERSION }}-ndk-${{ env.ANDROID_NDK_VERSION }}-${{ steps.contract.outputs.opentui }}

      - name: Save OpenCode durable cache
        if: success() && steps.final-opencode.outputs.ready == 'true' && steps.cache-opencode-product.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: ./ci/actions/incremental-cache
        with:
          mode: save-final
          path: |
            ${{ github.workspace }}/opencode/src
            ${{ env.WORK_DIR }}/dist/opencode
            ${{ env.WORK_DIR }}/state/nodes/opencode.json
          key: ${{ steps.contract.outputs.key }}-artifact

      - name: Save OpenCode Android NDK cache
        if: success() && steps.validate-opencode.outputs.ready != 'true' && steps.cache-ndk.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: ./ci/actions/incremental-cache
        with:
          mode: save-final
          path: ${{ env.ANDROID_NDK_HOME }}
          key: ci-cache-v2-toolchain-${{ runner.os }}-${{ runner.arch }}-ndk-${{ env.ANDROID_NDK_VERSION }}-api-${{ env.ANDROID_API }}

      - name: Save OpenCode Zig cache
        if: success() && steps.validate-opencode.outputs.ready != 'true' && steps.cache-zig.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: ./ci/actions/incremental-cache
        with:
          mode: save-final
          path: ${{ github.workspace }}/.ci/zig-${{ env.ZIG_VERSION }}
          key: ci-cache-v2-toolchain-${{ runner.os }}-${{ runner.arch }}-zig-${{ env.ZIG_VERSION }}-api-${{ env.ANDROID_API }}

      - name: Create distribution packages
        run: |
          source ci/scripts/env.sh && ./opencode/scripts/make-packages.sh

      - name: List packages
        run: ls -lh "${WORK_DIR}/packages/"

      # ── Upload + Release ──────────────────────────────────────
      - name: Upload packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-termux-${{ env.OPENCODE_VERSION }}
          path: |
            ${{ env.WORK_DIR }}/packages/*.zip
            ${{ env.WORK_DIR }}/packages/*.pkg.tar.xz
            ${{ env.WORK_DIR }}/packages/*.deb
          if-no-files-found: error

      - name: Upload standalone OpenCode artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-android-aarch64-${{ env.OPENCODE_VERSION }}
          path: ${{ env.WORK_DIR }}/dist/opencode
          if-no-files-found: error

      - name: Save OpenCode resumable checkpoint
        if: always() && failure()
        continue-on-error: true
        uses: ./ci/actions/incremental-cache
        with:
          mode: save-checkpoint
          checkpoint-prefix: ci-cache-v2-recovery-opencode-${{ runner.os }}-${{ runner.arch }}-version-${{ env.OPENCODE_VERSION }}-bun142-${{ hashFiles('ci/external-sources.lock') }}-opentui-${{ env.OPENTUI_REF }}-api-${{ env.ANDROID_API }}-ndk-${{ env.ANDROID_NDK_VERSION }}-source-${{ hashFiles('ci/source-manifest.json', 'opencode/src/package.json', 'opencode/src/bun.lock') }}-
          checkpoint-path: |
            ${{ github.workspace }}/opencode/src
            ${{ env.WORK_DIR }}
            ${{ github.workspace }}/opentui/src/opencode/packages/native/lib
            ${{ github.workspace }}/opentui/build
            ~/.bun

      - name: Write CI summary
        if: always()
        env:
          CACHE_DEPENDENCIES: miss
          CACHE_INTERMEDIATES: ${{ steps.cache-opentui-zig.outputs.cache-hit == 'true' && 'hit' || 'miss' }}
        run: source ci/scripts/ci-summary.sh && ci_summary

      - name: Cleanup intermediate files
        if: always()
        run: |
          find "${WORK_DIR}" -maxdepth 1 -type f -name '*.tgz' -delete
          df -h .
