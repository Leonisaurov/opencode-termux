name: Build OpenCode (final assembly)

on:
  workflow_dispatch:
    inputs:
      opencode_version:
        description: 'OpenCode version to build'
        required: false
        default: '1.3.13'
  push:
    tags:
      - 'v*'
    paths:
      - 'patches/opentui/**'
      - 'scripts/build-opentui.sh'
      - 'scripts/build-opencode.sh'
      - 'scripts/build-opencode-android.ts'
      - 'scripts/make-packages.sh'
  workflow_call:
    inputs:
      opencode_version:
        description: 'Versión de OpenCode'
        required: false
        type: string
        default: '1.3.13'
      require_dependency_artifacts:
        description: 'Falla si faltan artifacts producidos por el DAG caller'
        required: false
        type: boolean
        default: false

concurrency:
  group: build-opencode-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.2.13"
  OPENCODE_VERSION: "1.3.13"
  ANDROID_API: "24"
  ANDROID_NDK_VERSION: "28.1.13356709"
  ZIG_VERSION: "0.15.2"
  JOBS: "2"
  WORK_DIR: "${{ github.workspace }}/build"
  ANDROID_NDK_HOME: "${{ github.workspace }}/android-ndk"
  ANDROID_NDK_ROOT: "${{ github.workspace }}/android-ndk"

jobs:
  build-opencode:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Override OpenCode version from input
        if: github.event.inputs.opencode_version
        run: echo "OPENCODE_VERSION=${{ github.event.inputs.opencode_version }}" >> $GITHUB_ENV

      - name: Create work directory
        run: mkdir -p "$WORK_DIR"

      # ── Restore cached toolchain ──────────────────────────────
      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_NDK_HOME }}
          key: android-ndk-${{ env.ANDROID_NDK_VERSION }}

      - name: Cache Zig
        id: cache-zig
        uses: actions/cache@v4
        with:
          path: ${{ env.WORK_DIR }}/zig-${{ env.ZIG_VERSION }}
          key: zig-${{ env.ZIG_VERSION }}

      - name: Cache Bun host
        id: cache-bun-host
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-host-1.3.2

      # ── Install everything else ───────────────────────────────
      - name: Install build dependencies
        run: source scripts/setup-runner.sh

      - name: Receive Bun artifact
        uses: actions/download-artifact@v4
        continue-on-error: ${{ !inputs.require_dependency_artifacts }}
        with:
          name: bun-android-aarch64-${{ env.BUN_VERSION }}
          path: ${{ env.WORK_DIR }}/artifact-bun

      - name: Materialize Bun artifact
        run: |
          BUN="$(find "$WORK_DIR/artifact-bun" -type f -name bun -print -quit 2>/dev/null || true)"
          if [ -z "$BUN" ] && [ "${{ inputs.require_dependency_artifacts }}" = "true" ]; then
            echo 'Required Bun artifact is missing or malformed.' >&2
            exit 1
          fi
          if [ -n "$BUN" ]; then
            mkdir -p "$WORK_DIR/bun-build"
            install -m 0755 "$BUN" "$WORK_DIR/bun-build/bun"
          fi

      - name: Receive OpenTUI artifact
        uses: actions/download-artifact@v4
        continue-on-error: ${{ !inputs.require_dependency_artifacts }}
        with:
          name: libopentui-arm64-musl
          path: ${{ env.WORK_DIR }}/artifact-opentui

      - name: Materialize OpenTUI artifact
        run: |
          LIB="$(find "$WORK_DIR/artifact-opentui" -type f -name libopentui.so -print -quit 2>/dev/null || true)"
          if [ -z "$LIB" ] && [ "${{ inputs.require_dependency_artifacts }}" = "true" ]; then
            echo 'Required OpenTUI artifact is missing or malformed.' >&2
            exit 1
          fi
          if [ -n "$LIB" ]; then
            DEST="$WORK_DIR/opentui-src/packages/core/src/lib/aarch64-linux-musl"
            mkdir -p "$DEST"
            install -m 0755 "$LIB" "$DEST/libopentui.so"
          fi

      # ── Restore Bun binary (required — run build-bun first) ──
      - name: Restore Bun binary
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.WORK_DIR }}/bun-build/bun
            ${{ env.WORK_DIR }}/state/nodes/bun.json
          key: build-v3-bun-${{ env.BUN_VERSION }}-restore
          restore-keys: |
            build-v3-bun-${{ env.BUN_VERSION }}-

      # ── Build libopentui.so ───────────────────────────────────
      - name: Cache OpenTUI build
        id: cache-opentui
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WORK_DIR }}/opentui-src/packages/core/src/lib
            ${{ env.WORK_DIR }}/state/nodes/opentui.json
          key: build-v3-opentui-restore
          restore-keys: |
            build-v3-opentui-

      - name: Build libopentui.so
        run: |
          source scripts/env.sh && ./scripts/build-opentui.sh

      # ── Build OpenCode + packages ─────────────────────────────
      - name: Build OpenCode standalone binary
        run: |
          source scripts/env.sh && ./scripts/build-opencode.sh

      - name: Verify OpenCode binary
        run: |
          OPENCODE_BINARY="${WORK_DIR}/dist/opencode"
          ls -lh "$OPENCODE_BINARY"
          file "$OPENCODE_BINARY"
          readelf -h "$OPENCODE_BINARY" | grep -E "Machine|Class"

      - name: Create distribution packages
        run: |
          source scripts/env.sh && ./scripts/make-packages.sh

      - name: List packages
        run: ls -lh "${WORK_DIR}/packages/"

      # ── Upload + Release ──────────────────────────────────────
      - name: Upload packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-termux-${{ env.OPENCODE_VERSION }}
          path: |
            ${{ env.WORK_DIR }}/packages/*.zip
            ${{ env.WORK_DIR }}/packages/*.pkg.tar.xz
            ${{ env.WORK_DIR }}/packages/*.deb

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.WORK_DIR }}/packages/*.zip
            ${{ env.WORK_DIR }}/packages/*.pkg.tar.xz
            ${{ env.WORK_DIR }}/packages/*.deb
          body: |
            ## OpenCode ${{ env.OPENCODE_VERSION }} for Android/Termux (aarch64)

            ### Installation

            **Termux (pacman):**
            ```bash
            pacman -U opencode-${{ env.OPENCODE_VERSION }}-1-aarch64.pkg.tar.xz
            ```

            **Termux (dpkg):**
            ```bash
            dpkg -i opencode_${{ env.OPENCODE_VERSION }}_aarch64.deb
            ```

            **Standalone binary:**
            ```bash
            chmod +x opencode && mv opencode $PREFIX/bin/
            ```

            ### Build info
            - Bun: v${{ env.BUN_VERSION }} (cross-compiled for Android aarch64)
            - Android API level: ${{ env.ANDROID_API }}
            - NDK: r28b (${{ env.ANDROID_NDK_VERSION }})
          draft: false
          prerelease: false

      - name: Cleanup intermediate files
        if: always()
        run: |
          find "${WORK_DIR}" -maxdepth 1 -type f -name '*.tgz' -delete
          df -h .
