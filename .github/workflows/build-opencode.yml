name: Build OpenCode (final assembly)

on:
  workflow_dispatch:
    inputs:
      opentui_ref:
        description: 'Commit, tag o branch de OpenTUI'
        required: false
        default: '9eabce704096837148d935554fcae9c19e6e21f4'
      opencode_version:
        description: 'OpenCode version to build'
        required: false
        default: '1.3.13'
  workflow_call:
    inputs:
      opentui_ref:
        description: 'Commit, tag o branch de OpenTUI'
        required: false
        type: string
        default: '9eabce704096837148d935554fcae9c19e6e21f4'
      opencode_version:
        description: 'Versión de OpenCode'
        required: false
        type: string
        default: '1.3.13'
      require_dependency_artifacts:
        description: 'Falla si faltan artifacts producidos por el DAG caller'
        required: false
        type: boolean
        default: false

concurrency:
  group: build-opencode-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PRODUCT: opencode
  BUN_VERSION: "1.2.13"
  OPENTUI_REF: "${{ inputs.opentui_ref || '9eabce704096837148d935554fcae9c19e6e21f4' }}"
  OPENCODE_VERSION: "${{ inputs.opencode_version || '1.3.13' }}"
  ANDROID_API: "24"
  ANDROID_NDK_VERSION: "28.1.13356709"
  WEBKIT_COMMIT: "017930ebf915121f8f593bef61cbbca82d78132d"
  ZIG_VERSION: "0.15.2"
  WORK_DIR: "${{ github.workspace }}/opencode/build"
  ANDROID_NDK_HOME: "${{ github.workspace }}/opencode/build/android-ndk"
  ANDROID_NDK_ROOT: "${{ github.workspace }}/opencode/build/android-ndk"

jobs:
  build-opencode:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Override OpenCode version from input
        if: github.event.inputs.opencode_version
        run: echo "OPENCODE_VERSION=${{ github.event.inputs.opencode_version }}" >> $GITHUB_ENV

      - name: Create work directory
        run: mkdir -p "$WORK_DIR"

      - name: Compute OpenCode cache contract
        id: contract
        env:
          UPSTREAM_COMMIT: ${{ inputs.opentui_ref || '9eabce704096837148d935554fcae9c19e6e21f4' }}
        run: |
          set -euo pipefail
          export ANDROID_TRIPLE_API="aarch64-linux-android${ANDROID_API}"
          args=(--root "$GITHUB_WORKSPACE" --product opencode
            --path opencode/scripts/build-opencode.sh --path opencode/scripts/make-packages.sh
            --path ci/scripts/env.sh --path opencode/patches
            --value "OPENCODE_VERSION=$OPENCODE_VERSION" --value "BUN_VERSION=$BUN_VERSION")
          opencode_key="$(python3 ci/scripts/cache-contract.py key "${args[@]}")"
          echo "key=$opencode_key" >> "$GITHUB_OUTPUT"
          bun_args=(--root "$GITHUB_WORKSPACE" --product bun
            --path bun/scripts/build-bun.sh --path bun/scripts/apply-patches.sh
            --path ci/scripts/env.sh --path bun/patches/bun/android-support.patch
            --path bun/patches/zig/posix-android-sigaction.patch
            --value "BUN_VERSION=$BUN_VERSION" --value "WEBKIT_COMMIT=$WEBKIT_COMMIT")
          bun_key="$(python3 ci/scripts/cache-contract.py key "${bun_args[@]}")"
          echo "bun=$bun_key" >> "$GITHUB_OUTPUT"

      # ── Restore cached toolchain ──────────────────────────────
      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_NDK_HOME }}
          key: ci-cache-v1-toolchain-${{ runner.os }}-${{ runner.arch }}-ndk-${{ env.ANDROID_NDK_VERSION }}-api-${{ env.ANDROID_API }}

      - name: Cache Zig
        id: cache-zig
        uses: actions/cache@v4
        with:
          path: ${{ env.WORK_DIR }}/zig-${{ env.ZIG_VERSION }}
          key: ci-cache-v1-toolchain-${{ runner.os }}-${{ runner.arch }}-zig-${{ env.ZIG_VERSION }}-api-${{ env.ANDROID_API }}

      - name: Cache Bun host
        id: cache-bun-host
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: ${{ steps.contract.outputs.key }}-bun-host

      - name: Receive Bun artifact
        uses: actions/download-artifact@v4
        continue-on-error: ${{ !inputs.require_dependency_artifacts }}
        with:
          name: bun-android-aarch64-${{ env.BUN_VERSION }}
          path: ${{ env.WORK_DIR }}/artifact-bun

      - name: Materialize Bun artifact
        run: |
          BUN="$(find "$WORK_DIR/artifact-bun" -type f -name bun -print -quit 2>/dev/null || true)"
          if [ -z "$BUN" ] && [ "${{ inputs.require_dependency_artifacts }}" = "true" ]; then
            echo 'Required Bun artifact is missing or malformed.' >&2
            exit 1
          fi
          if [ -n "$BUN" ]; then
            mkdir -p "$GITHUB_WORKSPACE/bun/build/bun-build"
            install -m 0755 "$BUN" "$GITHUB_WORKSPACE/bun/build/bun-build/bun"
          fi

      - name: Receive OpenTUI artifact
        uses: actions/download-artifact@v4
        continue-on-error: ${{ !inputs.require_dependency_artifacts }}
        with:
          # build-opentui resolves branches/tags to an immutable commit, so
          # the producer's artifact suffix is intentionally not the raw input.
          pattern: opentui-android-aarch64-*
          merge-multiple: true
          path: ${{ env.WORK_DIR }}/artifact-opentui

      - name: Materialize OpenTUI artifact
        run: |
          LIB="$(find "$WORK_DIR/artifact-opentui" -type f -name libopentui.so -print -quit 2>/dev/null || true)"
          if [ -z "$LIB" ] && [ "${{ inputs.require_dependency_artifacts }}" = "true" ]; then
            echo 'Required OpenTUI artifact is missing or malformed.' >&2
            exit 1
          fi
          if [ -n "$LIB" ]; then
            DEST="$GITHUB_WORKSPACE/opentui/src/opencode/packages/core/src/lib/aarch64-linux-android.24"
            mkdir -p "$DEST"
            install -m 0755 "$LIB" "$DEST/libopentui.so"
          fi

      # ── Restore Bun binary (required — run build-bun first) ──
      - name: Restore Bun binary
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ github.workspace }}/bun/build/bun-build/bun
            ${{ github.workspace }}/bun/build/state/nodes/bun.json
          key: ${{ steps.contract.outputs.bun }}

      # Restore all caches/artifacts before paying for runner setup.
      - name: Install build dependencies
        run: source ci/scripts/setup-runner.sh

      # ── Build libopentui.so ───────────────────────────────────
      - name: Cache OpenTUI build
        if: ${{ !inputs.require_dependency_artifacts }}
        id: cache-opentui
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/opentui/src/opencode/packages/core/src/lib
            ${{ github.workspace }}/opentui/build/state/nodes/opentui.json
          key: ci-cache-v1-opentui-direct-${{ env.OPENTUI_REF }}-${{ hashFiles('opentui/scripts/build-opentui.sh', 'ci/scripts/env.sh', 'opentui/patches/**') }}

      - name: Build libopentui.so
        if: ${{ !inputs.require_dependency_artifacts }}
        run: |
          PRODUCT=opentui ./opentui/scripts/build-opentui.sh

      # ── Build OpenCode + packages ─────────────────────────────
      - name: Build OpenCode standalone binary
        run: |
          source ci/scripts/env.sh && ./opencode/scripts/build-opencode.sh

      - name: Verify OpenCode binary
        run: |
          OPENCODE_BINARY="${WORK_DIR}/dist/opencode"
          ls -lh "$OPENCODE_BINARY"
          file "$OPENCODE_BINARY"
          readelf -h "$OPENCODE_BINARY" | grep -E "Machine|Class"

      - name: Create distribution packages
        run: |
          source ci/scripts/env.sh && ./opencode/scripts/make-packages.sh

      - name: List packages
        run: ls -lh "${WORK_DIR}/packages/"

      # ── Upload + Release ──────────────────────────────────────
      - name: Upload packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-termux-${{ env.OPENCODE_VERSION }}
          path: |
            ${{ env.WORK_DIR }}/packages/*.zip
            ${{ env.WORK_DIR }}/packages/*.pkg.tar.xz
            ${{ env.WORK_DIR }}/packages/*.deb

      - name: Upload standalone OpenCode artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-android-aarch64-${{ env.OPENCODE_VERSION }}
          path: ${{ env.WORK_DIR }}/dist/opencode
          if-no-files-found: error

      - name: Write CI summary
        if: always()
        env:
          CACHE_DEPENDENCIES: ${{ steps.cache-bun-host.outputs.cache-hit == 'true' && 'hit' || 'miss' }}
          CACHE_INTERMEDIATES: ${{ steps.cache-opentui.outputs.cache-hit == 'true' && 'hit' || 'miss' }}
        run: source ci/scripts/ci-summary.sh && ci_summary

      - name: Cleanup intermediate files
        if: always()
        run: |
          find "${WORK_DIR}" -maxdepth 1 -type f -name '*.tgz' -delete
          df -h .
