name: Build Core (ICU + WebKit + TinyCC)

on:
  workflow_dispatch:
  push:
    paths:
      - 'patches/webkit/**'
      - 'scripts/build-icu.sh'
      - 'scripts/build-webkit.sh'
      - 'scripts/build-tinycc.sh'
      - 'scripts/env.sh'
      - 'scripts/setup-runner.sh'
      - 'scripts/build-state.py'
      - 'cmake/**'

env:
  ICU_VERSION: "75.1"
  ANDROID_API: "24"
  ANDROID_NDK_VERSION: "28.1.13356709"
  WEBKIT_COMMIT: "017930ebf915121f8f593bef61cbbca82d78132d"
  TINYCC_COMMIT: "b91835d8701523e895a2b447713630069514e291"
  ZIG_VERSION: "0.15.2"
  JOBS: "2"
  WORK_DIR: "${{ github.workspace }}/build"
  ANDROID_NDK_HOME: "${{ github.workspace }}/android-ndk"
  ANDROID_NDK_ROOT: "${{ github.workspace }}/android-ndk"

jobs:
  build-core:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Create work directory
        run: mkdir -p "$WORK_DIR"

      # ── Restore cached toolchain ──────────────────────────────
      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_NDK_HOME }}
          key: android-ndk-${{ env.ANDROID_NDK_VERSION }}

      - name: Cache Zig
        id: cache-zig
        uses: actions/cache@v4
        with:
          path: ${{ env.WORK_DIR }}/zig-${{ env.ZIG_VERSION }}
          key: zig-${{ env.ZIG_VERSION }}

      # ── Install everything else ───────────────────────────────
      - name: Install build dependencies
        run: source scripts/setup-runner.sh

      # ── Patch hashes ──────────────────────────────────────────
      - name: Compute patch hashes
        id: hashes
        run: echo "webkit_patch_hash=$(sha256sum patches/webkit/android-support.patch | cut -c1-16)" >> $GITHUB_OUTPUT

      # ── ICU ───────────────────────────────────────────────────
      - name: Cache ICU build
        id: cache-icu
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WORK_DIR }}/deps-android/prefix
            ${{ env.WORK_DIR }}/state/nodes/icu.json
          key: build-v2-icu-${{ env.ICU_VERSION }}-${{ env.ANDROID_API }}-${{ github.sha }}
          restore-keys: |
            build-v2-icu-${{ env.ICU_VERSION }}-${{ env.ANDROID_API }}-

      - name: Build ICU
        run: |
          df -h .
          source scripts/env.sh && ./scripts/build-icu.sh
          df -h .

      # ── WebKit/JSC ────────────────────────────────────────────
      - name: Cache WebKit build
        id: cache-webkit
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WORK_DIR }}/webkit-android
            ${{ env.WORK_DIR }}/state/nodes/webkit.json
          key: build-v2-webkit-${{ env.WEBKIT_COMMIT }}-${{ steps.hashes.outputs.webkit_patch_hash }}-${{ github.sha }}
          restore-keys: |
            build-v2-webkit-${{ env.WEBKIT_COMMIT }}-${{ steps.hashes.outputs.webkit_patch_hash }}-

      - name: Clone, patch, and build WebKit/JSC
        run: |
          source scripts/env.sh
          ./scripts/apply-patches.sh
          ./scripts/build-webkit.sh

      # ── TinyCC ────────────────────────────────────────────────
      - name: Build TinyCC
        run: |
          source scripts/env.sh && ./scripts/build-tinycc.sh

      - name: Upload core build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-android-artifacts
          path: |
            ${{ env.WORK_DIR }}/deps-android/prefix
            ${{ env.WORK_DIR }}/webkit-android
          if-no-files-found: error

      - name: Cleanup intermediate files
        if: always()
        run: |
          # Keep source and compiler state: build-state.py decides what is reusable.
          find "${WORK_DIR}" -maxdepth 1 -type f -name '*.tgz' -delete
          df -h .
