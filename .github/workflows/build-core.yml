name: Build Core (ICU + WebKit + TinyCC)

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-core-${{ github.ref }}
  cancel-in-progress: false

env:
  PRODUCT: bun
  ICU_VERSION: "75.1"
  ANDROID_API: "24"
  ANDROID_NDK_VERSION: "28.1.13356709"
  TINYCC_SOURCE: "current"
  ZIG_VERSION: "0.15.2"
  WORK_DIR: "${{ github.workspace }}/bun/build"
  ANDROID_NDK_HOME: "${{ github.workspace }}/bun/build/android-ndk"
  ANDROID_NDK_ROOT: "${{ github.workspace }}/bun/build/android-ndk"

jobs:
  build-core:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Create work directory
        run: mkdir -p "$WORK_DIR"

      # ── Restore cached toolchain ──────────────────────────────
      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.ANDROID_NDK_HOME }}
          key: ci-cache-v2-toolchain-${{ runner.os }}-${{ runner.arch }}-ndk-${{ env.ANDROID_NDK_VERSION }}-api-${{ env.ANDROID_API }}

      - name: Cache Zig
        id: cache-zig
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WORK_DIR }}/zig-${{ env.ZIG_VERSION }}
          key: ci-cache-v2-toolchain-${{ runner.os }}-${{ runner.arch }}-zig-${{ env.ZIG_VERSION }}-api-${{ env.ANDROID_API }}

      # ── Versioned source contract ─────────────────────────────
      - name: Compute cache contract key
        id: contract
        run: |
          set -euo pipefail
          export ANDROID_TRIPLE_API="aarch64-linux-android${ANDROID_API}"
          key_args=(--root "$GITHUB_WORKSPACE" --product bun-core
            --path bun/scripts/build-icu.sh --path bun/scripts/build-webkit.sh
            --path bun/scripts/build-tinycc.sh --path ci/scripts/env.sh
            --path .github/workflows/build-core.yml
            --path ci/external-sources.lock --path ci/source-manifest.json
            --path bun/webkit
            --path bun/tinycc
            --path bun/cmake/webkit-android-toolchain.cmake
            --value "ICU_VERSION=$ICU_VERSION"
            --value "TINYCC_SOURCE=$TINYCC_SOURCE")
          cache_key="$(python3 ci/scripts/cache-contract.py key "${key_args[@]}")"
          echo "key=$cache_key" >> "$GITHUB_OUTPUT"

      # ── ICU ───────────────────────────────────────────────────
      - name: Cache ICU build
        id: cache-icu
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.WORK_DIR }}/deps-android/prefix
            ${{ env.WORK_DIR }}/state/nodes/icu.json
          key: ${{ steps.contract.outputs.key }}-icu

      - name: Validate ICU cache
        id: validate-icu
        run: |
          set -euo pipefail
          if test -s "${WORK_DIR}/deps-android/prefix/lib/libicuuc.a" \
             && python3 ci/scripts/build-state.py verify --root "$GITHUB_WORKSPACE" \
                  --state-dir "$WORK_DIR/state" --node icu >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore ICU build intermediates
        if: steps.cache-icu.outputs.cache-hit != 'true' || steps.validate-icu.outputs.ready != 'true'
        id: cache-icu-intermediates
        uses: ./ci/actions/incremental-cache
        with:
          mode: restore-intermediate
          key: ci-cache-v2-core-icu-intermediates-${{ runner.os }}-${{ runner.arch }}-api-${{ env.ANDROID_API }}-ndk-${{ env.ANDROID_NDK_VERSION }}-icu-${{ env.ICU_VERSION }}-${{ steps.contract.outputs.key }}
          restore-prefix: ci-cache-v2-core-icu-intermediates-${{ runner.os }}-${{ runner.arch }}-api-${{ env.ANDROID_API }}-ndk-${{ env.ANDROID_NDK_VERSION }}-icu-${{ env.ICU_VERSION }}-
          path: |
            ${{ env.WORK_DIR }}/icu-src
            ${{ env.WORK_DIR }}/icu-host-build
            ${{ env.WORK_DIR }}/icu-android-build
            ${{ env.WORK_DIR }}/deps-android/prefix
            ${{ env.WORK_DIR }}/state/nodes/icu.json
            ${{ env.WORK_DIR }}/cache/ccache

      # ── WebKit/JSC ────────────────────────────────────────────
      - name: Cache WebKit build
        id: cache-webkit
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.WORK_DIR }}/webkit-android
            ${{ env.WORK_DIR }}/state/nodes/webkit.json
            ${{ env.WORK_DIR }}/state/nodes/tinycc.json
          key: ${{ steps.contract.outputs.key }}-webkit

      - name: Validate WebKit cache
        id: validate-webkit
        run: |
          set -euo pipefail
          if test -s "${WORK_DIR}/webkit-android/cmakeconfig.h" \
             && test -d "${WORK_DIR}/webkit-android/include/JavaScriptCore" \
             && find "${WORK_DIR}/webkit-android/lib" -maxdepth 1 -type f -name '*.a' -size +0c -print -quit | grep -q . \
             && python3 ci/scripts/build-state.py verify --root "$GITHUB_WORKSPACE" \
                  --state-dir "$WORK_DIR/state" --node webkit >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore WebKit build intermediates
        if: steps.cache-webkit.outputs.cache-hit != 'true' || steps.validate-webkit.outputs.ready != 'true'
        id: cache-webkit-intermediates
        uses: ./ci/actions/incremental-cache
        with:
          mode: restore-intermediate
          key: ci-cache-v2-core-webkit-intermediates-${{ runner.os }}-${{ runner.arch }}-api-${{ env.ANDROID_API }}-ndk-${{ env.ANDROID_NDK_VERSION }}-webkit-current-${{ steps.contract.outputs.key }}
          restore-prefix: ci-cache-v2-core-webkit-intermediates-${{ runner.os }}-${{ runner.arch }}-api-${{ env.ANDROID_API }}-ndk-${{ env.ANDROID_NDK_VERSION }}-webkit-current-
          path: |
            ${{ env.WORK_DIR }}/webkit-src
            ${{ env.WORK_DIR }}/webkit-build
            ${{ env.WORK_DIR }}/webkit-android
            ${{ env.WORK_DIR }}/state/nodes/webkit.json
            ${{ env.WORK_DIR }}/cache/ccache

      # ── TinyCC ────────────────────────────────────────────────
      - name: Validate TinyCC cache
        id: validate-tinycc
        run: |
          set -euo pipefail
          if test -s "${WORK_DIR}/webkit-android/lib/libtcc.a" \
             && python3 ci/scripts/build-state.py verify --root "$GITHUB_WORKSPACE" \
                  --state-dir "$WORK_DIR/state" --node tinycc >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore TinyCC build intermediates
        if: steps.validate-tinycc.outputs.ready != 'true'
        id: cache-tinycc-intermediates
        uses: ./ci/actions/incremental-cache
        with:
          mode: restore-intermediate
          key: ci-cache-v2-core-tinycc-intermediates-${{ runner.os }}-${{ runner.arch }}-api-${{ env.ANDROID_API }}-ndk-${{ env.ANDROID_NDK_VERSION }}-tinycc-current-${{ steps.contract.outputs.key }}
          restore-prefix: ci-cache-v2-core-tinycc-intermediates-${{ runner.os }}-${{ runner.arch }}-api-${{ env.ANDROID_API }}-ndk-${{ env.ANDROID_NDK_VERSION }}-tinycc-current-
          path: |
            ${{ env.WORK_DIR }}/tinycc-build-android
            ${{ env.WORK_DIR }}/webkit-android/lib/libtcc.a
            ${{ env.WORK_DIR }}/state/nodes/tinycc.json
            ${{ env.WORK_DIR }}/cache/ccache

      # The exact caches contain only validated outputs. Stage-specific
      # checkpoints avoid overlaying a stale WebKit tree when only ICU is
      # missing, while still allowing each compiler to resume its own state.
      - name: Restore ICU resumable checkpoint
        if: steps.cache-icu.outputs.cache-hit != 'true' || steps.validate-icu.outputs.ready != 'true'
        uses: ./ci/actions/incremental-cache
        with:
          mode: restore-checkpoint
          checkpoint-prefix: ci-cache-v2-recovery-core-icu-${{ runner.os }}-${{ runner.arch }}-api-${{ env.ANDROID_API }}-ndk-${{ env.ANDROID_NDK_VERSION }}-icu-${{ env.ICU_VERSION }}-
          checkpoint-path: |
            ${{ env.ANDROID_NDK_HOME }}
            ${{ env.WORK_DIR }}/zig-${{ env.ZIG_VERSION }}
            ${{ env.WORK_DIR }}/icu-src
            ${{ env.WORK_DIR }}/icu-host-build
            ${{ env.WORK_DIR }}/icu-android-build
            ${{ env.WORK_DIR }}/deps-android/prefix
            ${{ env.WORK_DIR }}/state/nodes/icu.json
            ${{ env.WORK_DIR }}/cache/ccache

      - name: Restore WebKit resumable checkpoint
        if: steps.cache-webkit.outputs.cache-hit != 'true' || steps.validate-webkit.outputs.ready != 'true'
        uses: ./ci/actions/incremental-cache
        with:
          mode: restore-checkpoint
          checkpoint-prefix: ci-cache-v2-recovery-core-webkit-${{ runner.os }}-${{ runner.arch }}-api-${{ env.ANDROID_API }}-ndk-${{ env.ANDROID_NDK_VERSION }}-webkit-current-
          checkpoint-path: |
            ${{ env.ANDROID_NDK_HOME }}
            ${{ env.WORK_DIR }}/zig-${{ env.ZIG_VERSION }}
            ${{ env.WORK_DIR }}/webkit-src
            ${{ env.WORK_DIR }}/webkit-build
            ${{ env.WORK_DIR }}/webkit-android
            ${{ env.WORK_DIR }}/state/nodes/webkit.json
            ${{ env.WORK_DIR }}/cache/ccache

      - name: Restore TinyCC resumable checkpoint
        if: steps.cache-webkit.outputs.cache-hit != 'true' || steps.validate-webkit.outputs.ready != 'true' || steps.validate-tinycc.outputs.ready != 'true'
        uses: ./ci/actions/incremental-cache
        with:
          mode: restore-checkpoint
          checkpoint-prefix: ci-cache-v2-recovery-core-tinycc-${{ runner.os }}-${{ runner.arch }}-api-${{ env.ANDROID_API }}-ndk-${{ env.ANDROID_NDK_VERSION }}-tinycc-current-
          checkpoint-path: |
            ${{ env.ANDROID_NDK_HOME }}
            ${{ env.WORK_DIR }}/zig-${{ env.ZIG_VERSION }}
            ${{ env.WORK_DIR }}/tinycc-build-android
            ${{ env.WORK_DIR }}/webkit-android/lib/libtcc.a
            ${{ env.WORK_DIR }}/state/nodes/tinycc.json
            ${{ env.WORK_DIR }}/cache/ccache

      - name: Validate Core state after checkpoint restore
        id: validate-core
        run: |
          set -euo pipefail
          node_valid() {
            python3 ci/scripts/build-state.py verify --root "$GITHUB_WORKSPACE" \
              --state-dir "$WORK_DIR/state" --node "$1" >/dev/null 2>&1
          }
          icu=false
          webkit=false
          tinycc=false
          if node_valid icu && test -s "${WORK_DIR}/deps-android/prefix/lib/libicuuc.a"; then icu=true; fi
          if node_valid webkit && test -s "${WORK_DIR}/webkit-android/cmakeconfig.h" && test -d "${WORK_DIR}/webkit-android/include/JavaScriptCore" && find "${WORK_DIR}/webkit-android/lib" -maxdepth 1 -type f -name '*.a' -size +0c -print -quit | grep -q .; then webkit=true; fi
          if node_valid tinycc && test -s "${WORK_DIR}/webkit-android/lib/libtcc.a"; then tinycc=true; fi
          echo "icu_ready=$icu" >> "$GITHUB_OUTPUT"
          echo "webkit_ready=$webkit" >> "$GITHUB_OUTPUT"
          echo "tinycc_ready=$tinycc" >> "$GITHUB_OUTPUT"

      # Installing packages is unnecessary when every validated cache is ready.
      - name: Install build dependencies
        if: steps.cache-icu.outputs.cache-hit != 'true' || steps.validate-icu.outputs.ready != 'true' || steps.cache-webkit.outputs.cache-hit != 'true' || steps.validate-webkit.outputs.ready != 'true' || steps.validate-tinycc.outputs.ready != 'true'
        run: source ci/scripts/setup-runner.sh

      - name: Enable zram swap
        if: steps.cache-icu.outputs.cache-hit != 'true' || steps.validate-icu.outputs.ready != 'true' || steps.cache-webkit.outputs.cache-hit != 'true' || steps.validate-webkit.outputs.ready != 'true' || steps.validate-tinycc.outputs.ready != 'true'
        uses: ./ci/actions/zram

      - name: Build ICU
        if: steps.cache-icu.outputs.cache-hit != 'true' || steps.validate-icu.outputs.ready != 'true'
        run: |
          df -h .
          source ci/scripts/env.sh && ./bun/scripts/build-icu.sh
          df -h .

      - name: Build WebKit/JSC from current source
        if: steps.cache-webkit.outputs.cache-hit != 'true' || steps.validate-webkit.outputs.ready != 'true'
        run: |
          source ci/scripts/env.sh
          ./bun/scripts/build-webkit.sh

      - name: Build TinyCC
        if: steps.cache-webkit.outputs.cache-hit != 'true' || steps.validate-tinycc.outputs.ready != 'true'
        run: |
          source ci/scripts/env.sh && ./bun/scripts/build-tinycc.sh

      - name: Validate Core outputs for durable caches
        if: always()
        id: final-core
        run: |
          set -euo pipefail
          node_valid() {
            python3 ci/scripts/build-state.py verify --root "$GITHUB_WORKSPACE" \
              --state-dir "$WORK_DIR/state" --node "$1" >/dev/null 2>&1
          }
          icu=false
          webkit=false
          tinycc=false
          if node_valid icu && test -s "${WORK_DIR}/deps-android/prefix/lib/libicuuc.a"; then icu=true; fi
          if node_valid webkit && test -s "${WORK_DIR}/webkit-android/cmakeconfig.h" && test -d "${WORK_DIR}/webkit-android/include/JavaScriptCore" && find "${WORK_DIR}/webkit-android/lib" -maxdepth 1 -type f -name '*.a' -size +0c -print -quit | grep -q .; then webkit=true; fi
          if node_valid tinycc && test -s "${WORK_DIR}/webkit-android/lib/libtcc.a"; then tinycc=true; fi
          echo "icu_ready=$icu" >> "$GITHUB_OUTPUT"
          echo "webkit_ready=$webkit" >> "$GITHUB_OUTPUT"
          echo "tinycc_ready=$tinycc" >> "$GITHUB_OUTPUT"
          if [ "$icu" != true ] || [ "$webkit" != true ] || [ "$tinycc" != true ]; then
            echo "ERROR: one or more core stages are not valid; refusing to publish a successful core job." >&2
            exit 1
          fi

      - name: Validate Core toolchains for durable cache
        if: always()
        id: final-toolchains
        run: |
          set -euo pipefail
          ndk=false
          zig=false
          if test -x "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang"; then ndk=true; fi
          if test -x "${WORK_DIR}/zig-${ZIG_VERSION}/zig"; then zig=true; fi
          echo "ndk_ready=$ndk" >> "$GITHUB_OUTPUT"
          echo "zig_ready=$zig" >> "$GITHUB_OUTPUT"
          # A complete exact core cache is publishable without the toolchains:
          # the runner will not compile anything in that case. If the core
          # cache was rebuilt, however, both toolchains must be present.
          core_ready=false
          if [ "${{ steps.final-core.outputs.icu_ready }}" = true ] \
             && [ "${{ steps.final-core.outputs.webkit_ready }}" = true ] \
             && [ "${{ steps.final-core.outputs.tinycc_ready }}" = true ]; then
            core_ready=true
          fi
          if [ "$core_ready" != true ] && { [ "$ndk" != true ] || [ "$zig" != true ]; }; then
            echo "ERROR: Android NDK or Zig toolchain is incomplete." >&2
            exit 1
          fi

      - name: Save Core Android NDK cache
        if: always() && steps.final-toolchains.outputs.ndk_ready == 'true' && steps.cache-ndk.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: ./ci/actions/incremental-cache
        with:
          mode: save-final
          path: ${{ env.ANDROID_NDK_HOME }}
          key: ci-cache-v2-toolchain-${{ runner.os }}-${{ runner.arch }}-ndk-${{ env.ANDROID_NDK_VERSION }}-api-${{ env.ANDROID_API }}

      - name: Save Core Zig toolchain cache
        if: always() && steps.final-toolchains.outputs.zig_ready == 'true' && steps.cache-zig.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: ./ci/actions/incremental-cache
        with:
          mode: save-final
          path: ${{ env.WORK_DIR }}/zig-${{ env.ZIG_VERSION }}
          key: ci-cache-v2-toolchain-${{ runner.os }}-${{ runner.arch }}-zig-${{ env.ZIG_VERSION }}-api-${{ env.ANDROID_API }}

      - name: Save ICU durable cache
        if: always() && steps.final-core.outputs.icu_ready == 'true' && steps.cache-icu.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: ./ci/actions/incremental-cache
        with:
          mode: save-final
          key: ${{ steps.contract.outputs.key }}-icu
          path: |
            ${{ env.WORK_DIR }}/deps-android/prefix
            ${{ env.WORK_DIR }}/state/nodes/icu.json

      - name: Save ICU build intermediates
        if: always() && steps.final-core.outputs.icu_ready == 'true' && steps.cache-icu.outputs.cache-hit != 'true' && steps.cache-icu-intermediates.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: ./ci/actions/incremental-cache
        with:
          mode: save-intermediate
          key: ci-cache-v2-core-icu-intermediates-${{ runner.os }}-${{ runner.arch }}-api-${{ env.ANDROID_API }}-ndk-${{ env.ANDROID_NDK_VERSION }}-icu-${{ env.ICU_VERSION }}-${{ steps.contract.outputs.key }}
          path: |
            ${{ env.WORK_DIR }}/icu-src
            ${{ env.WORK_DIR }}/icu-host-build
            ${{ env.WORK_DIR }}/icu-android-build
            ${{ env.WORK_DIR }}/deps-android/prefix
            ${{ env.WORK_DIR }}/state/nodes/icu.json
            ${{ env.WORK_DIR }}/cache/ccache

      - name: Save WebKit durable cache
        if: always() && steps.final-core.outputs.webkit_ready == 'true' && steps.final-core.outputs.tinycc_ready == 'true' && steps.cache-webkit.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: ./ci/actions/incremental-cache
        with:
          mode: save-final
          key: ${{ steps.contract.outputs.key }}-webkit
          path: |
            ${{ env.WORK_DIR }}/webkit-android
            ${{ env.WORK_DIR }}/state/nodes/webkit.json
            ${{ env.WORK_DIR }}/state/nodes/tinycc.json

      - name: Save WebKit build intermediates
        if: always() && steps.final-core.outputs.webkit_ready == 'true' && steps.cache-webkit.outputs.cache-hit != 'true' && steps.cache-webkit-intermediates.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: ./ci/actions/incremental-cache
        with:
          mode: save-intermediate
          key: ci-cache-v2-core-webkit-intermediates-${{ runner.os }}-${{ runner.arch }}-api-${{ env.ANDROID_API }}-ndk-${{ env.ANDROID_NDK_VERSION }}-webkit-current-${{ steps.contract.outputs.key }}
          path: |
            ${{ env.WORK_DIR }}/webkit-src
            ${{ env.WORK_DIR }}/webkit-build
            ${{ env.WORK_DIR }}/webkit-android
            ${{ env.WORK_DIR }}/state/nodes/webkit.json
            ${{ env.WORK_DIR }}/cache/ccache

      - name: Save TinyCC build intermediates
        if: always() && steps.final-core.outputs.tinycc_ready == 'true' && steps.cache-tinycc-intermediates.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: ./ci/actions/incremental-cache
        with:
          mode: save-intermediate
          key: ci-cache-v2-core-tinycc-intermediates-${{ runner.os }}-${{ runner.arch }}-api-${{ env.ANDROID_API }}-ndk-${{ env.ANDROID_NDK_VERSION }}-tinycc-current-${{ steps.contract.outputs.key }}
          path: |
            ${{ env.WORK_DIR }}/tinycc-build-android
            ${{ env.WORK_DIR }}/webkit-android/lib/libtcc.a
            ${{ env.WORK_DIR }}/state/nodes/tinycc.json
            ${{ env.WORK_DIR }}/cache/ccache

      # A failed run gets one immutable checkpoint per stage. Keeping these
      # namespaces separate is important: a partial ICU retry must not replace
      # a usable WebKit tree (or vice versa) in the next runner.
      - name: Save ICU resumable checkpoint
        if: always() && failure()
        continue-on-error: true
        uses: ./ci/actions/incremental-cache
        with:
          mode: save-checkpoint
          checkpoint-prefix: ci-cache-v2-recovery-core-icu-${{ runner.os }}-${{ runner.arch }}-api-${{ env.ANDROID_API }}-ndk-${{ env.ANDROID_NDK_VERSION }}-icu-${{ env.ICU_VERSION }}-
          checkpoint-path: |
            ${{ env.ANDROID_NDK_HOME }}
            ${{ env.WORK_DIR }}/zig-${{ env.ZIG_VERSION }}
            ${{ env.WORK_DIR }}/icu-src
            ${{ env.WORK_DIR }}/icu-host-build
            ${{ env.WORK_DIR }}/icu-android-build
            ${{ env.WORK_DIR }}/deps-android/prefix
            ${{ env.WORK_DIR }}/state/nodes/icu.json
            ${{ env.WORK_DIR }}/cache/ccache

      - name: Save WebKit resumable checkpoint
        if: always() && failure()
        continue-on-error: true
        uses: ./ci/actions/incremental-cache
        with:
          mode: save-checkpoint
          checkpoint-prefix: ci-cache-v2-recovery-core-webkit-${{ runner.os }}-${{ runner.arch }}-api-${{ env.ANDROID_API }}-ndk-${{ env.ANDROID_NDK_VERSION }}-webkit-current-
          checkpoint-path: |
            ${{ env.ANDROID_NDK_HOME }}
            ${{ env.WORK_DIR }}/zig-${{ env.ZIG_VERSION }}
            ${{ env.WORK_DIR }}/webkit-src
            ${{ env.WORK_DIR }}/webkit-build
            ${{ env.WORK_DIR }}/webkit-android
            ${{ env.WORK_DIR }}/state/nodes/webkit.json
            ${{ env.WORK_DIR }}/cache/ccache

      - name: Save TinyCC resumable checkpoint
        if: always() && failure()
        continue-on-error: true
        uses: ./ci/actions/incremental-cache
        with:
          mode: save-checkpoint
          checkpoint-prefix: ci-cache-v2-recovery-core-tinycc-${{ runner.os }}-${{ runner.arch }}-api-${{ env.ANDROID_API }}-ndk-${{ env.ANDROID_NDK_VERSION }}-tinycc-current-
          checkpoint-path: |
            ${{ env.ANDROID_NDK_HOME }}
            ${{ env.WORK_DIR }}/zig-${{ env.ZIG_VERSION }}
            ${{ env.WORK_DIR }}/tinycc-build-android
            ${{ env.WORK_DIR }}/webkit-android/lib/libtcc.a
            ${{ env.WORK_DIR }}/state/nodes/tinycc.json
            ${{ env.WORK_DIR }}/cache/ccache

      - name: Write CI summary
        if: always()
        env:
          CACHE_DEPENDENCIES: ${{ steps.cache-icu.outputs.cache-hit == 'true' && 'hit' || 'miss' }}
          CACHE_INTERMEDIATES: ${{ steps.cache-webkit-intermediates.outputs.cache-hit == 'true' && 'hit' || 'miss' }}
        run: source ci/scripts/ci-summary.sh && ci_summary

      - name: Cleanup intermediate files
        if: always()
        run: |
          # Keep source and compiler state: build-state.py decides what is reusable.
          find "${WORK_DIR}" -maxdepth 1 -type f -name '*.tgz' -delete
          df -h .
