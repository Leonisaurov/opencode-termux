name: Test ARM64 Runner
on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Check arch
        run: |
          echo "Runner: $(uname -m)"
          echo "Kernel: $(uname -r)"
          echo "CPU: $(cat /proc/cpuinfo | grep 'model name' | head -1)"
          echo "Available: $(nproc) cores"
          free -h
