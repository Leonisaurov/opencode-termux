name: V2 probe de ensamblado (build-opencode.sh real)

# Evidencia B4 en rama: el DAG de build-android.yml no puede correrse aqui,
# asi que la sonda materializa las dependencias desde las corridas verdes de
# main (bun-android 1.2.13 y opentui-android 0.5.14/31a93fbe) exactamente como
# las pasos "Receive/Materialize" del workflow de producto, y ejecuta
# opencode/scripts/build-opencode.sh sin variaciones. No publica nada.

on:
  workflow_dispatch:
  push:
    branches:
      - feat/opencode-v2
    paths:
      - .github/workflows/v2-probe-assembly.yml
      - opencode/scripts/build-opencode.sh
      - opencode/scripts/build-opencode-android.ts
      - ci/scripts/module-graph-patch.ts
      - ci/scripts/patch-opentui-core-runtime.py

permissions:
  contents: read

env:
  BUN_VERSION: "1.2.13"
  HOST_BUN_VERSION: "1.3.2"
  OPENTUI_REF: "31a93fbe66992298d6d0f27481fa781f43d0c1e2"
  OPENCODE_VERSION: "2.0.24"
  PRODUCT: opencode
  BUN_SOURCE_RUN: "37412517206"
  OPENTUI_SOURCE_RUN: "37491176567"

jobs:
  assembly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Host Bun 1.3.2 (emisor del grafo)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hostsdk"
          curl -fsSL -o "$RUNNER_TEMP/bun.zip" \
            "https://github.com/oven-sh/bun/releases/download/bun-v${HOST_BUN_VERSION}/bun-linux-x64.zip"
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP/hostsdk"
          mkdir -p "$GITHUB_WORKSPACE/.probe-bin"
          install -m 0755 "$RUNNER_TEMP/hostsdk/bun-linux-x64/bun" "$GITHUB_WORKSPACE/.probe-bin/bun"
          echo "$GITHUB_WORKSPACE/.probe-bin" >> "$GITHUB_PATH"
          test "$(bun --version)" = "$HOST_BUN_VERSION"

      - name: 'S1: recibir artefactos verdes de main (bun + opentui)'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WORK_DIR="$GITHUB_WORKSPACE/opencode/build"
          mkdir -p "$WORK_DIR/artifact-bun" "$WORK_DIR/artifact-opentui"
          gh run download "$BUN_SOURCE_RUN" -R "$GITHUB_REPOSITORY" \
            -n "bun-android-aarch64-$BUN_VERSION" -D "$WORK_DIR/artifact-bun"
          gh run download "$OPENTUI_SOURCE_RUN" -R "$GITHUB_REPOSITORY" \
            -p "opentui-android-aarch64-*" -D "$WORK_DIR/artifact-opentui"
          ls -l "$WORK_DIR/artifact-bun" "$WORK_DIR/artifact-opentui"

      - name: 'S2: materializar con las mismas validaciones del workflow de producto'
        run: |
          set -euo pipefail
          WORK_DIR="$GITHUB_WORKSPACE/opencode/build"
          BUN="$(find "$WORK_DIR/artifact-bun" -type f -name bun -print -quit)"
          test "$(readelf -h "$BUN" | sed -n 's/^ *Machine: *//p')" = AArch64
          mkdir -p "$GITHUB_WORKSPACE/bun/build/bun-build"
          install -m 0755 "$BUN" "$GITHUB_WORKSPACE/bun/build/bun-build/bun"

          LIB="$(find "$WORK_DIR/artifact-opentui" -type f -name libopentui.so -print -quit)"
          INFO="$(find "$WORK_DIR/artifact-opentui" -type f -name build-info.txt -print -quit)"
          grep -Fxq "opentui_commit=$OPENTUI_REF" "$INFO"
          test "$(readelf -h "$LIB" | sed -n 's/^ *Machine: *//p')" = AArch64
          readelf -d "$LIB" | grep -q 'NEEDED.*libc.so'
          DEST="$GITHUB_WORKSPACE/opentui/src/opencode/packages/native/lib/aarch64-linux-android.24"
          mkdir -p "$DEST"
          install -m 0755 "$LIB" "$DEST/libopentui.so"

      - name: 'S3: corrida del script de producto build-opencode.sh'
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/opencode/build/probe"
          source ci/scripts/env.sh && ./opencode/scripts/build-opencode.sh 2>&1 | tee "$GITHUB_WORKSPACE/opencode/build/probe/assembly.log"

      - name: 'S4: verificacion del standalone Android'
        run: |
          set -euo pipefail
          BIN="$GITHUB_WORKSPACE/opencode/build/dist/opencode"
          ls -lh "$BIN"
          file "$BIN"
          test "$(readelf -h "$BIN" | sed -n 's/^ *Class: *//p')" = ELF64
          test "$(readelf -h "$BIN" | sed -n 's/^ *Machine: *//p')" = AArch64
          bun ci/scripts/module-graph-patch.ts validate-standalone opencode "$BIN"

      - name: 'S5: artefactos de la sonda'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-assembly-opencode-android-${{ github.run_number }}
          path: |
            opencode/build/dist/opencode
            opencode/build/probe/assembly.log
          if-no-files-found: warn
