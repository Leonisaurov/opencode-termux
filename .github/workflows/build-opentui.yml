# build-opentui.yml
#
# Cross-compila libopentui.so para Android ARM64 (aarch64) usando Zig estándar
# y el libc.so del NDK. El port de fuente produce el ELF Android directamente.
#
# Flujo:
#   1. Restaura/instala el NDK y Zig 0.15.2.
#   2. Usa el árbol de OpenTUI vendorizado en el checkout raíz.
#   3. opentui/scripts/build-opentui.sh valida el árbol y compila
#      `aarch64-linux-android.24` con el libc.so del NDK.
#   5. Verifica NEEDED: libc.so y sube el artifact
#      `opentui-android-aarch64-<commit>`.
#
# El artifact es consumido por build-opencode.yml (Fase 2) para ensamblar
# OpenCode. El .so se guarda TAMBIÉN en el cache con key
# `build-v4-opentui-<commit>-<hash>`
# (path REAL: $OPENTUI_SRC/packages/core/src/lib) para que
# build-opencode.yml lo restaure sin recompilar. Además se cachea la fuente
# keyed por commit para rebuilds rápidos y compartición del toolchain zig
# con los otros workflows.

name: Build libopentui.so (Android ARM64)

on:
  workflow_dispatch:
    inputs:
      # Debe coincidir con el fallback de env.OPENTUI_REF (commit verificado
      # localmente en opentui/src/opencode). Cambiar a 'main' para seguir HEAD.
      #
      # CAMINO FÁCIL DE UPGRADE: para actualizar opentui, cambiar este pin al
      # commit nuevo. La cache key del .so es POR COMMIT
      # (build-v4-opentui-<commit>-<hash>) → al cambiar el pin, la key cambia
      # automáticamente → cache miss → se recompila. Nada más que tocar.
      opentui_ref:
        description: 'Commit exacto de OpenTUI versionado en este repositorio.'
        required: false
        default: '658db4cbe0da0adfeb5edac0273ee68911b29c3e'
  workflow_call:
    inputs:
      opentui_ref:
        description: 'Commit, tag o branch de OpenTUI'
        required: false
        type: string
        default: '658db4cbe0da0adfeb5edac0273ee68911b29c3e'

permissions:
  contents: read

concurrency:
  group: build-opentui-${{ github.ref }}
  cancel-in-progress: false

env:
  ZIG_VERSION: "0.15.2"                    # ziglang.org estándar (NO oven-sh)
  OPENTUI_TARGET: "aarch64-linux-android.24"
  ANDROID_API: "24"
  ANDROID_NDK_VERSION: "28.1.13356709"
  OPENTUI_REF: "${{ inputs.opentui_ref || '658db4cbe0da0adfeb5edac0273ee68911b29c3e' }}"
  PRODUCT: opentui
  WORK_DIR: "${{ github.workspace }}/opentui/build"
  OPENTUI_SRC: "${{ github.workspace }}/opentui/src/opencode"
  # NOTA: PREFIX se define a nivel de step (build) — el contexto runner no
  # está disponible en el env de nivel workflow.

jobs:
  build-opentui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Create work directory
        run: mkdir -p "$WORK_DIR"

      - name: Compute OpenTUI cache contract
        id: contract
        env:
          UPSTREAM_COMMIT: ${{ env.OPENTUI_REF }}
        run: |
          set -euo pipefail
          export ANDROID_TRIPLE_API="aarch64-linux-android${ANDROID_API}"
          args=(--root "$GITHUB_WORKSPACE" --product opentui
            --path opentui/scripts/build-opentui.sh --path ci/scripts/env.sh
            --path .github/workflows/build-opentui.yml
            --path ci/source-manifest.json --value "OPENTUI_REF=$OPENTUI_REF"
            --value "OPENTUI_TARGET=$OPENTUI_TARGET")
          cache_key="$(python3 ci/scripts/cache-contract.py key "${args[@]}")"
          echo "key=$cache_key" >> "$GITHUB_OUTPUT"

      # ── Cachés ────────────────────────────────────────────────
      - name: Cache Zig toolchain
        id: cache-zig
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WORK_DIR }}/zig-${{ env.ZIG_VERSION }}
          key: ci-cache-v2-toolchain-${{ runner.os }}-${{ runner.arch }}-zig-${{ env.ZIG_VERSION }}-api-${{ env.ANDROID_API }}

      - name: Restore OpenTUI output cache
        id: cache-opentui-output
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.OPENTUI_SRC }}/packages/core/src/lib
            ${{ env.WORK_DIR }}/state/nodes/opentui.json
          key: ${{ steps.contract.outputs.key }}-artifact

      - name: Validate OpenTUI output cache
        id: validate-opentui
        run: |
          set -euo pipefail
          LIB="$OPENTUI_SRC/packages/core/src/lib/$OPENTUI_TARGET/libopentui.so"
          if test -s "$LIB" \
             && test "$(readelf -h "$LIB" | sed -n 's/^ *Class: *//p')" = ELF64 \
             && test "$(readelf -h "$LIB" | sed -n 's/^ *Machine: *//p')" = AArch64 \
             && readelf -d "$LIB" | grep -q 'NEEDED.*libc.so' \
             && python3 ci/scripts/build-state.py verify --root "$GITHUB_WORKSPACE" \
                  --state-dir "$WORK_DIR/state" --node opentui >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # Restore reusable state before the per-attempt checkpoint. The
      # checkpoint is applied last so a newer partial build always wins over
      # an older stable intermediate cache.
      - name: Restore OpenTUI source cache
        if: steps.validate-opentui.outputs.ready != 'true'
        id: cache-opentui
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.OPENTUI_SRC }}
          key: ${{ steps.contract.outputs.key }}-source

      - name: Restore OpenTUI Zig intermediates
        if: steps.validate-opentui.outputs.ready != 'true'
        id: cache-zig-intermediates
        uses: ./ci/actions/incremental-cache
        with:
          mode: restore-intermediate
          key: ci-cache-v2-opentui-intermediates-${{ runner.os }}-${{ runner.arch }}-commit-${{ env.OPENTUI_REF }}-target-${{ env.OPENTUI_TARGET }}-zig-${{ env.ZIG_VERSION }}-ndk-${{ env.ANDROID_NDK_VERSION }}-${{ steps.contract.outputs.key }}
          restore-prefix: ci-cache-v2-opentui-intermediates-${{ runner.os }}-${{ runner.arch }}-commit-${{ env.OPENTUI_REF }}-target-${{ env.OPENTUI_TARGET }}-zig-${{ env.ZIG_VERSION }}-ndk-${{ env.ANDROID_NDK_VERSION }}-
          path: |
            ${{ env.WORK_DIR }}/cache/zig-opentui
            ${{ env.WORK_DIR }}/cache/zig-global

      - name: Restore OpenTUI resumable checkpoint
        if: steps.cache-opentui-output.outputs.cache-hit != 'true' || steps.validate-opentui.outputs.ready != 'true'
        uses: ./ci/actions/incremental-cache
        with:
          mode: restore-checkpoint
          checkpoint-prefix: ci-cache-v2-recovery-opentui-${{ runner.os }}-${{ runner.arch }}-commit-${{ env.OPENTUI_REF }}-target-${{ env.OPENTUI_TARGET }}-zig-${{ env.ZIG_VERSION }}-ndk-${{ env.ANDROID_NDK_VERSION }}-
          checkpoint-path: |
            ${{ env.OPENTUI_SRC }}
            ${{ env.WORK_DIR }}/cache
            ${{ env.WORK_DIR }}/state/nodes
            ${{ env.WORK_DIR }}/android-ndk
            ${{ env.WORK_DIR }}/zig-${{ env.ZIG_VERSION }}

      # ── Toolchain ─────────────────────────────────────────────
      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WORK_DIR }}/android-ndk
          key: ci-cache-v2-toolchain-${{ runner.os }}-${{ runner.arch }}-ndk-${{ env.ANDROID_NDK_VERSION }}-api-${{ env.ANDROID_API }}

      - name: Install Android NDK
        if: steps.validate-opentui.outputs.ready != 'true' && steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/android-ndk.zip"
          curl -fsSL "https://dl.google.com/android/repository/android-ndk-r28b-linux.zip" -o "$archive"
          rm -rf "$WORK_DIR/android-ndk" "$RUNNER_TEMP/ndk-extract"
          mkdir -p "$RUNNER_TEMP/ndk-extract" "$WORK_DIR/android-ndk"
          unzip -q "$archive" -d "$RUNNER_TEMP/ndk-extract"
          cp -a "$RUNNER_TEMP/ndk-extract/android-ndk-r28b/." "$WORK_DIR/android-ndk/"

      - name: Install Zig ${{ env.ZIG_VERSION }} (ziglang.org)
        if: steps.validate-opentui.outputs.ready != 'true'
        run: |
          if [ ! -x "$WORK_DIR/zig-$ZIG_VERSION/zig" ]; then
            mkdir -p "$WORK_DIR"
            cd "$RUNNER_TEMP"
            wget -q "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -O zig.tar.xz
            mkdir -p "$WORK_DIR/zig-$ZIG_VERSION"
            tar xf zig.tar.xz -C "$WORK_DIR/zig-$ZIG_VERSION" --strip-components=1
            rm zig.tar.xz
          fi
          echo "ZIG_BIN=$WORK_DIR/zig-$ZIG_VERSION/zig" >> "$GITHUB_ENV"
          echo "$WORK_DIR/zig-$ZIG_VERSION" >> "$GITHUB_PATH"
          "$WORK_DIR/zig-$ZIG_VERSION/zig" version

      - name: Write Android libc configuration for Zig
        if: steps.validate-opentui.outputs.ready != 'true'
        run: |
          set -euo pipefail
          ZIG_LIBC_FILE="$WORK_DIR/android-libc.txt"
          SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          cat > "$ZIG_LIBC_FILE" <<EOF
          # Android NDK bionic libc specification for Zig
          # The directory that contains stdlib.h
          include_dir=$SYSROOT/usr/include
          # The system-specific include directory (sys/errno.h etc)
          sys_include_dir=$SYSROOT/usr/include/aarch64-linux-android
          # Android uses crtbegin_static.o and crtend_android.o instead of crt1.o
          crt_dir=$SYSROOT/usr/lib/aarch64-linux-android/$ANDROID_API
          # Windows-only paths (not needed)
          msvc_lib_dir=
          kernel32_lib_dir=
          gcc_dir=
          EOF
          test -d "$SYSROOT/usr/include"
          test -d "$SYSROOT/usr/lib/aarch64-linux-android/$ANDROID_API"
          echo "ZIG_LIBC_FILE=$ZIG_LIBC_FILE" >> "$GITHUB_ENV"
          cat "$ZIG_LIBC_FILE"

      # ── Fuente versionada de OpenTUI ──────────────────────────
      - name: Prepare opentui source
        if: steps.validate-opentui.outputs.ready != 'true'
        run: |
          set -euo pipefail
          test -f "$OPENTUI_SRC/packages/core/src/zig/build.zig"
          test ! -e "$OPENTUI_SRC/.git"
          git ls-files --error-unmatch \
            opentui/src/opencode/packages/core/src/zig/build.zig \
            opentui/src/opencode/packages/core/src/zig/renderer.zig >/dev/null
          echo ">>> Vendored OpenTUI source ready at origin revision $OPENTUI_REF"

      - name: Enable zram swap
        if: steps.validate-opentui.outputs.ready != 'true'
        uses: ./ci/actions/zram

      # ── Build libopentui.so ────────────────────────────────────
      - name: Build libopentui.so (state validated)
        if: steps.validate-opentui.outputs.ready != 'true'
        # build-opentui.sh escribe el zig cache en $TMPDIR (patrón
        # Termux); en el runner apuntamos PREFIX a runner.temp para que el
        # script (set -u) no falle por variable sin definir.
        env:
          PREFIX: ${{ runner.temp }}
          ANDROID_NDK_HOME: ${{ github.workspace }}/opentui/build/android-ndk
          ANDROID_NDK_LIB_DIR: ${{ github.workspace }}/opentui/build/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/24
        run: |
          source ci/scripts/env.sh && ./opentui/scripts/build-opentui.sh

      - name: Verify libopentui.so
        run: |
          LIB="$OPENTUI_SRC/packages/core/src/lib/$OPENTUI_TARGET/libopentui.so"
          ls -lh "$LIB"
          file "$LIB"
          readelf -h "$LIB" | grep -E "Machine|Class"
          echo "DT_NEEDED:"
          readelf -d "$LIB" | grep NEEDED
          if ! readelf -d "$LIB" | grep -q "NEEDED.*libc.so"; then
            echo "ERROR: libopentui.so is missing NEEDED: libc.so"
            exit 1
          fi
          test "$(readelf -h "$LIB" | sed -n 's/^ *Machine: *//p')" = "AArch64"

      # ── Artifact ───────────────────────────────────────────────
      - name: Write build info
        if: steps.validate-opentui.outputs.ready != 'true'
        run: |
          LIB_DIR="$OPENTUI_SRC/packages/core/src/lib/$OPENTUI_TARGET"
          {
            echo "workflow=$GITHUB_WORKFLOW"
            echo "opentui_ref=$OPENTUI_REF"
            echo "opentui_commit=$OPENTUI_REF"
            echo "zig_version=$ZIG_VERSION"
            echo "target=$OPENTUI_TARGET"
            echo "job_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$LIB_DIR/build-info.txt"
          cat "$LIB_DIR/build-info.txt"

      - name: Validate OpenTUI outputs for durable caches
        if: always()
        id: final-opentui
        run: |
          set -euo pipefail
          LIB="$OPENTUI_SRC/packages/core/src/lib/$OPENTUI_TARGET/libopentui.so"
          ready=false
          if test -s "$LIB" \
             && python3 ci/scripts/build-state.py verify --root "$GITHUB_WORKSPACE" \
                  --state-dir "$WORK_DIR/state" --node opentui >/dev/null 2>&1 \
             && test "$(readelf -h "$LIB" | sed -n 's/^ *Class: *//p')" = ELF64 \
             && test "$(readelf -h "$LIB" | sed -n 's/^ *Machine: *//p')" = AArch64 \
             && readelf -d "$LIB" | grep -q 'NEEDED.*libc.so'; then
            ready=true
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" != true ]; then
            echo "ERROR: OpenTUI output or state manifest is not valid." >&2
            exit 1
          fi

      - name: Save libopentui.so to cache (key por commit)
        if: success() && steps.final-opentui.outputs.ready == 'true' && steps.cache-opentui-output.outputs.cache-hit != 'true'
        continue-on-error: true
        # build-opencode.yml restaura esta key y copia el .so a node_modules.
        # La key incluye el commit resuelto y el hash del build
        # (build-v4-opentui-<commit>-<hash>): cada
        # commit genera una entrada de cache PROPIA, así actions/cache
        # (que no sobreescribe) no choca entre runs con commits distintos.
        # continue-on-error permite que una carrera de dos runs no convierta
        # un build correcto en fallo de job.
        # UPGRADE FÁCIL: al cambiar el pin opentui_ref a un commit nuevo, la
        # key cambia automáticamente → cache miss → se recompila. Sin pasos
        # manuales.
        uses: ./ci/actions/incremental-cache
        with:
          mode: save-final
          path: |
            ${{ env.OPENTUI_SRC }}/packages/core/src/lib
            ${{ env.WORK_DIR }}/state/nodes/opentui.json
          key: ${{ steps.contract.outputs.key }}-artifact

      - name: Save OpenTUI source cache
        if: success() && steps.validate-opentui.outputs.ready != 'true' && steps.cache-opentui.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: ./ci/actions/incremental-cache
        with:
          mode: save-final
          path: ${{ env.OPENTUI_SRC }}
          key: ${{ steps.contract.outputs.key }}-source

      - name: Save OpenTUI Zig intermediates cache
        if: success() && steps.validate-opentui.outputs.ready != 'true' && steps.cache-zig-intermediates.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: ./ci/actions/incremental-cache
        with:
          mode: save-intermediate
          path: |
            ${{ env.WORK_DIR }}/cache/zig-opentui
            ${{ env.WORK_DIR }}/cache/zig-global
          key: ci-cache-v2-opentui-intermediates-${{ runner.os }}-${{ runner.arch }}-commit-${{ env.OPENTUI_REF }}-target-${{ env.OPENTUI_TARGET }}-zig-${{ env.ZIG_VERSION }}-ndk-${{ env.ANDROID_NDK_VERSION }}-${{ steps.contract.outputs.key }}

      - name: Save OpenTUI Zig toolchain cache
        if: success() && steps.validate-opentui.outputs.ready != 'true' && steps.cache-zig.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: ./ci/actions/incremental-cache
        with:
          mode: save-final
          path: ${{ env.WORK_DIR }}/zig-${{ env.ZIG_VERSION }}
          key: ci-cache-v2-toolchain-${{ runner.os }}-${{ runner.arch }}-zig-${{ env.ZIG_VERSION }}-api-${{ env.ANDROID_API }}

      - name: Save OpenTUI Android NDK cache
        if: success() && steps.validate-opentui.outputs.ready != 'true' && steps.cache-ndk.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: ./ci/actions/incremental-cache
        with:
          mode: save-final
          path: ${{ env.WORK_DIR }}/android-ndk
          key: ci-cache-v2-toolchain-${{ runner.os }}-${{ runner.arch }}-ndk-${{ env.ANDROID_NDK_VERSION }}-api-${{ env.ANDROID_API }}

      - name: Upload libopentui.so artifact
        uses: actions/upload-artifact@v4
        with:
          name: opentui-android-aarch64-${{ env.OPENTUI_REF }}
          path: ${{ env.OPENTUI_SRC }}/packages/core/src/lib/${{ env.OPENTUI_TARGET }}/
          if-no-files-found: error

      - name: Save OpenTUI resumable checkpoint
        if: always() && failure()
        continue-on-error: true
        uses: ./ci/actions/incremental-cache
        with:
          mode: save-checkpoint
          checkpoint-prefix: ci-cache-v2-recovery-opentui-${{ runner.os }}-${{ runner.arch }}-commit-${{ env.OPENTUI_REF }}-target-${{ env.OPENTUI_TARGET }}-zig-${{ env.ZIG_VERSION }}-ndk-${{ env.ANDROID_NDK_VERSION }}-
          checkpoint-path: |
            ${{ env.OPENTUI_SRC }}
            ${{ env.WORK_DIR }}/cache
            ${{ env.WORK_DIR }}/state/nodes
            ${{ env.WORK_DIR }}/android-ndk
            ${{ env.WORK_DIR }}/zig-${{ env.ZIG_VERSION }}

      - name: Write CI summary
        if: always()
        env:
          CACHE_DEPENDENCIES: ${{ steps.cache-ndk.outputs.cache-hit == 'true' && 'hit' || 'miss' }}
          CACHE_INTERMEDIATES: ${{ steps.cache-zig-intermediates.outputs.cache-hit == 'true' && 'hit' || 'miss' }}
        run: source ci/scripts/ci-summary.sh && ci_summary

      # ── Cleanup ────────────────────────────────────────────────
      - name: Cleanup zig build caches (keep cache lean)
        if: always()
        run: |
          find "$OPENTUI_SRC" -type d -name ".zig-cache" -prune -exec rm -rf {} + 2>/dev/null || true
          df -h .
