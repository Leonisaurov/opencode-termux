# v2-probe.yml
#
# PROBE DESECHABLE para el corte de riesgo H2.0(c) / decision CP-C.
# No construye el port: responde una sola pregunta — ¿puede `bun build
# --compile` producir, a partir del grafo del CLI de OpenCode v2 (upstream
# e7a34f09), un standalone con grafo de modulos extraible (el trailer
# "\n---- Bun! ----\n")? Si si => CP-C pasa y seguimos con el re-port. Si no
# (bun es incapaz de emitir un standalone desde esta entrada) => CP-C se
# dispara y se abandona v2.
#
# Validar en host (linux x64) NO prueba el binario Bionic; ese paso se
# re-confirma despues con el bun de build-bun.yml. Este probe solo decide
# viabilidad del pipeline de intercambio de grafo sobre el arbol v2.
#
# Se ejecuta de forma aislada sobre el upstream publico y se elimina al
# cerrar CP-C con evidencia en PROGRESS.md.

name: V2 Probe (H2.0c / CP-C)

on:
  # Se dispara al pushear este propio archivo a la feature branch: GitHub lee el
  # workflow desde el arbol del SHA empujado, asi que no requiere estar registrado
  # en la rama por defecto. workflow_dispatch queda para re-ejecuciones manuales.
  push:
    branches: [feat/opencode-v2]
    paths:
      - .github/workflows/v2-probe.yml
  workflow_dispatch:
    inputs:
      upstream_commit:
        description: 'Commit upstream de OpenCode v2 a sondear'
        required: false
        default: 'e7a34f09bfd9134dfade5a8ddb843f7030bc9a69'
      bun_version:
        description: 'Version de Bun para el probe'
        required: false
        default: '1.4.2'

permissions:
  contents: read

concurrency:
  group: v2-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_COMMIT: "${{ inputs.upstream_commit || 'e7a34f09bfd9134dfade5a8ddb843f7030bc9a69' }}"
  BUN_VERSION: "${{ inputs.bun_version || '1.4.2' }}"
  PROBE_DIR: "${{ github.workspace }}/_probe"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Preparar directorio de registro
        run: |
          set -uo pipefail
          mkdir -p "$PROBE_DIR/logs"
          echo "commit=$UPSTREAM_COMMIT bun=$BUN_VERSION" | tee "$PROBE_DIR/logs/00_meta.txt"

      - name: Checkout upstream OpenCode v2 (publico)
        uses: actions/checkout@v4
        with:
          repository: anomalyco/opencode
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: upstream
          fetch-depth: 1

      - name: Setup Bun ${{ env.BUN_VERSION }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Reporte estructural del arbol v2
        run: |
          set -uo pipefail
          L="$PROBE_DIR/logs/10_structure.txt"; : > "$L"
          cd upstream
          echo "--- packageManager / bun.lock ---" | tee -a "$L"
          grep -E '"packageManager"' package.json | tee -a "$L"
          test -f bun.lock && echo "bun.lock presente" | tee -a "$L" || echo "SIN bun.lock" | tee -a "$L"
          echo "--- entrada standalone ---" | tee -a "$L"
          test -f packages/cli/src/index.ts && echo "packages/cli/src/index.ts OK" | tee -a "$L" || echo "FALTA index.ts" | tee -a "$L"
          test -f packages/cli/bin/opencode.cjs && echo "bin/opencode.cjs OK" | tee -a "$L" || echo "bin/opencode.cjs: generado en build (no en fuente)" | tee -a "$L"
          echo "--- server-process / run ---" | tee -a "$L"
          for f in packages/cli/src/server-process.ts packages/cli/src/run/index.ts; do
            test -f "$f" && echo "$f OK" | tee -a "$L" || echo "FALTA $f" | tee -a "$L"
          done
          echo "--- equivalentes del worker TUI ---" | tee -a "$L"
          grep -RlE 'parser\.worker|Worker\(|new Worker|server-process' packages/cli/src packages/tui/src 2>/dev/null | head -20 | tee -a "$L" || echo "sin match directo" | tee -a "$L"
          echo "--- migraciones v2 ---" | tee -a "$L"
          ls packages/core/src/database/migration | wc -l | sed 's/^/archivos migration\/: /' | tee -a "$L"
          test -f packages/core/src/database/migration.gen.ts && echo "migration.gen.ts OK (imports estaticos => migraciones viajan en el grafo)" | tee -a "$L" || echo "FALTA migration.gen.ts" | tee -a "$L"
          echo "--- modelo de migracion: .ts o .sql? ---" | tee -a "$L"
          ls packages/core/src/database/migration | sed 's/.*\.//' | sort -u | tee -a "$L"
          echo "--- sqlite bun ---" | tee -a "$L"
          test -f packages/core/src/database/sqlite.bun.ts && echo "sqlite.bun.ts OK" | tee -a "$L" || echo "FALTA sqlite.bun.ts" | tee -a "$L"
          echo "--- @opentui/core en node_modules (tras install, ver paso 20) ---" | tee -a "$L"

      - name: bun install del workspace v2
        run: |
          set -uo pipefail
          L="$PROBE_DIR/logs/20_install.txt"
          cd upstream
          if timeout 20m bun install --frozen-lockfile >"$L" 2>&1 || timeout 20m bun install >>"$L" 2>&1; then
            echo "INSTALL_RESULT=ok" | tee -a "$L"
          else
            echo "INSTALL_RESULT=fail" | tee -a "$L"
          fi
          tail -30 "$L"
          echo "--- @opentui/core instalado? ---" | tee -a "$L"
          find node_modules/@opentui -maxdepth 2 -name package.json 2>/dev/null | head | tee -a "$L"
          find . -path '*/@opentui/core/parser.worker.js' 2>/dev/null | head -3 | tee -a "$L"
          test -f node_modules/@opentui/core/package.json && grep '"version"' node_modules/@opentui/core/package.json | tee -a "$L" || echo "no node_modules/@opentui/core raiz (puede estar en packages/*)" | tee -a "$L"

      - name: 'CP-C test A: bun build --compile (bare) sobre el CLI v2'
        run: |
          set -uo pipefail
          L="$PROBE_DIR/logs/30_compile_bare.txt"; : > "$L"
          cd upstream
          mkdir -p "$PROBE_DIR/out"
          echo "cmd: bun build packages/cli/src/index.ts --compile --outfile $PROBE_DIR/out/opencode-bare" | tee -a "$L"
          timeout 15m bun build packages/cli/src/index.ts --compile --outfile "$PROBE_DIR/out/opencode-bare" >>"$L" 2>&1
          rc=$?
          echo "rc=$rc" | tee -a "$L"
          tail -40 "$L"
          if [ -f "$PROBE_DIR/out/opencode-bare" ]; then
            echo "standalone emitido: $(stat -c %s "$PROBE_DIR/out/opencode-bare") bytes" | tee -a "$L"
            file "$PROBE_DIR/out/opencode-bare" | tee -a "$L"
            # Verificar trailer del modulo grafo (la senal que consume module-graph-patch.ts)
            if grep -qa -- '---- Bun! ----' "$PROBE_DIR/out/opencode-bare"; then
              echo "TRAILER=presente" | tee -a "$L"
            else
              echo "TRAILER=ausente" | tee -a "$L"
            fi
          else
            echo "sin standalone" | tee -a "$L"
          fi

      - name: 'CP-C test B: Bun.build({compile}) con solid plugin (shape de pipeline)'
        run: |
          set -uo pipefail
          L="$PROBE_DIR/logs/40_compile_pipeline_shape.txt"; : > "$L"
          cd upstream
          cat > "$PROBE_DIR/build-probe.ts" <<'TS'
          import { createSolidTransformPlugin } from "@opentui/solid/bun-plugin"
          const res = await Bun.build({
            conditions: ["bun", "node"],
            plugins: [createSolidTransformPlugin()],
            compile: {
              autoloadBunfig: false,
              autoloadDotenv: false,
              autoloadTsconfig: true,
              autoloadPackageJson: true,
              outfile: process.env.PROBE_DIR + "/out/opencode-shape",
            },
            entrypoints: ["./packages/cli/src/index.ts"],
            define: { OPENCODE_VERSION: "'2.0.24'", OPENCODE_CHANNEL: "'latest'" },
          })
          console.log("success=" + res.success)
          if (!res.success) for (const l of res.logs) console.error(l.message ?? l)
          TS
          timeout 15m bun run "$PROBE_DIR/build-probe.ts" >>"$L" 2>&1
          rc=$?
          echo "rc=$rc" | tee -a "$L"
          tail -40 "$L"
          if [ -f "$PROBE_DIR/out/opencode-shape" ]; then
            echo "standalone-shape: $(stat -c %s "$PROBE_DIR/out/opencode-shape") bytes" | tee -a "$L"
            grep -qa -- '---- Bun! ----' "$PROBE_DIR/out/opencode-shape" && echo "TRAILER=presente" | tee -a "$L" || echo "TRAILER=ausente" | tee -a "$L"
          else
            echo "sin standalone-shape" | tee -a "$L"
          fi

      - name: Volcar veredicto
        run: |
          set -uo pipefail
          V="$PROBE_DIR/logs/99_verdict.txt"; : > "$V"
          a=$(grep -h 'TRAILER=' "$PROBE_DIR"/logs/30_compile_bare.txt 2>/dev/null | head -1 || true)
          b=$(grep -h 'TRAILER=' "$PROBE_DIR"/logs/40_compile_pipeline_shape.txt 2>/dev/null | head -1 || true)
          {
            echo "install: $(grep -h INSTALL_RESULT= "$PROBE_DIR"/logs/20_install.txt | head -1)"
            echo "bare-compile: $a"
            echo "shape-compile: $b"
            echo "CP-C: si cualquiera reporta TRAILER=presente => viable (continuar); si bun no emite standalone desde packages/cli => abandonar v2"
          } | tee "$V"

      - name: Subir logs del probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-probe-${{ github.run_number }}
          path: ${{ env.PROBE_DIR }}/logs/
          if-no-files-found: warn
