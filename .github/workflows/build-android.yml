name: Build and publish Android stack

on:
  push:
    branches: [main]
    paths:
      - 'bun/**'
      - 'kilo/**'
      - 'opencode/**'
      - 'opentui/**'
      - 'ci/**'
      - 'releases/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      release:
        required: true
        default: '2.0.24'
      bun_version:
        required: true
        default: '1.2.13'
      opentui_ref:
        required: true
        default: '31a93fbe66992298d6d0f27481fa781f43d0c1e2'
      opencode_version:
        required: true
        default: '2.0.24'
      kilo_version:
        required: true
        default: '7.4.20'

permissions:
  contents: read

concurrency:
  group: stack-release-${{ github.event.inputs.release || github.ref }}
  # Let an active build publish its recovery checkpoints; newer pending runs
  # still supersede older pending runs in this concurrency group.
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      core: ${{ steps.changes.outputs.build_core }}
      opentui: ${{ steps.changes.outputs.build_opentui }}
      bun: ${{ steps.changes.outputs.build_bun }}
      opencode: ${{ steps.changes.outputs.build_opencode }}
      kilo: ${{ steps.changes.outputs.build_kilo }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect affected producer graph
        id: changes
        env:
          BASE_SHA: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'changed_products=manual' >> "$GITHUB_OUTPUT"
            for product in core opentui bun opencode kilo; do
              echo "build_${product}=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi

          base="${BASE_SHA:-}"
          case "$base" in
            ''|0000000000000000000000000000000000000000)
              base='HEAD^'
              ;;
          esac
          python3 ci/scripts/changed-products.py \
            --root "$GITHUB_WORKSPACE" --base "$base" --head HEAD \
            --format github --graph >> "$GITHUB_OUTPUT"

      - name: Validate static CI contracts
        run: |
          set -euo pipefail
          # Pure-static checks: cache-contract parity, vendored TinyCC ABI,
          # OpenTUI runtime patch, downstream bundle contracts and change
          # detection. They need no runner setup and guard every product before
          # any expensive job. `test-module-graph-patch` needs host Bun and runs
          # in the jobs that install it.
          for test in \
            test-workflow-cache-contracts \
            test-cache-report \
            test-tinycc-sources \
            test-patch-opentui-core-runtime \
            test-downstream-bundle-contracts \
            test-changed-products; do
            echo ">>> $test"
            python3 "ci/scripts/$test.py"
          done

  core:
    needs: detect
    if: needs.detect.outputs.core == 'true'
    uses: ./.github/workflows/build-core.yml
    secrets: inherit
  opentui:
    needs: detect
    if: needs.detect.outputs.opentui == 'true'
    uses: ./.github/workflows/build-opentui.yml
    with:
      opentui_ref: ${{ inputs.opentui_ref || '31a93fbe66992298d6d0f27481fa781f43d0c1e2' }}
    secrets: inherit
  bun:
    needs: [detect, core]
    if: needs.detect.outputs.bun == 'true'
    uses: ./.github/workflows/build-bun.yml
    with:
      bun_version: ${{ inputs.bun_version || '1.2.13' }}
    secrets: inherit
  opencode:
    needs: [detect, bun, opentui]
    if: needs.detect.outputs.opencode == 'true'
    uses: ./.github/workflows/build-opencode.yml
    with:
      bun_version: ${{ inputs.bun_version || '1.2.13' }}
      opentui_ref: ${{ inputs.opentui_ref || '31a93fbe66992298d6d0f27481fa781f43d0c1e2' }}
      opencode_version: ${{ inputs.opencode_version || '2.0.24' }}
      require_dependency_artifacts: true
    secrets: inherit
  kilo:
    needs: [detect, bun]
    if: needs.detect.outputs.kilo == 'true'
    uses: ./.github/workflows/build-kilo.yml
    with:
      use_existing_bun: true
      bun_version: ${{ inputs.bun_version || '1.2.13' }}
      kilo_version: ${{ inputs.kilo_version || '7.4.20' }}
    secrets: inherit
  publish:
    needs: [detect, bun, opentui, opencode, kilo]
    if: ${{ github.event_name == 'workflow_dispatch' && always() && needs.detect.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-input
      - name: Verify all producers and create manifest
        env:
          RELEASE: ${{ inputs.release || '2.0.24' }}
          BUN_VERSION: ${{ inputs.bun_version || '1.2.13' }}
          OPENTUI_REF: ${{ inputs.opentui_ref || '31a93fbe66992298d6d0f27481fa781f43d0c1e2' }}
          OPENCODE_VERSION: ${{ inputs.opencode_version || '2.0.24' }}
          KILO_VERSION: ${{ inputs.kilo_version || '7.4.20' }}
        run: |
          set -euo pipefail
          test -d release-input
          python3 ci/scripts/package-stack-release.py --root release-input --out release-output --release "$RELEASE" --stack-version 1.0.0 --bun "$BUN_VERSION" --opentui "$OPENTUI_REF" --opencode "$OPENCODE_VERSION" --kilo "$KILO_VERSION"
      - name: Publish immutable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stack-v${{ inputs.release || '2.0.24' }}
          name: opencode-termux stack ${{ inputs.release || '2.0.24' }}
          files: release-output/*
          make_latest: true
          fail_on_unmatched_files: true
