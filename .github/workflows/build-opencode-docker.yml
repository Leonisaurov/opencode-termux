name: Build OpenCode standalone

# Compatibility entry point for the former ARM-runner workflow. It now uses
# the same reproducible producer graph as the coordinator, so it cannot drift
# to stale cache keys, a different OpenTUI ABI, or an unpinned source tree.
on:
  workflow_dispatch:
    inputs:
      opentui_ref:
        required: false
        default: '31a93fbe66992298d6d0f27481fa781f43d0c1e2'
      opencode_version:
        required: false
        default: '2.0.24'

permissions:
  contents: read

concurrency:
  group: build-opencode-standalone-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # No core/bun jobs: OpenCode cross-compiles against the runtime pinned in
  # ci/external-sources.lock, so OpenTUI is its only producer in this run.
  opentui:
    uses: ./.github/workflows/build-opentui.yml
    with:
      opentui_ref: ${{ inputs.opentui_ref || '31a93fbe66992298d6d0f27481fa781f43d0c1e2' }}
    secrets: inherit

  opencode:
    needs: [opentui]
    uses: ./.github/workflows/build-opencode.yml
    with:
      opentui_ref: ${{ inputs.opentui_ref || '31a93fbe66992298d6d0f27481fa781f43d0c1e2' }}
      opencode_version: ${{ inputs.opencode_version || '2.0.24' }}
      require_dependency_artifacts: true
    secrets: inherit
