name: Build Bun

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Core (ICU + WebKit + TinyCC)"]
    types: [completed]
  push:
    paths:
      - 'patches/bun/**'
      - 'patches/zig/**'
      - 'scripts/build-bun.sh'

concurrency:
  group: build-bun-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.2.13"
  ANDROID_API: "24"
  ANDROID_NDK_VERSION: "28.1.13356709"
  ICU_VERSION: "75.1"
  ZIG_VERSION: "0.15.2"
  WEBKIT_COMMIT: "017930ebf915121f8f593bef61cbbca82d78132d"
  JOBS: "2"
  WORK_DIR: "${{ github.workspace }}/build"
  ANDROID_NDK_HOME: "${{ github.workspace }}/android-ndk"
  ANDROID_NDK_ROOT: "${{ github.workspace }}/android-ndk"

jobs:
  build-bun:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Create work directory
        run: mkdir -p "$WORK_DIR"

      # ── Restore cached toolchain ──────────────────────────────
      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_NDK_HOME }}
          key: android-ndk-${{ env.ANDROID_NDK_VERSION }}

      - name: Cache Zig
        id: cache-zig
        uses: actions/cache@v4
        with:
          path: ${{ env.WORK_DIR }}/zig-${{ env.ZIG_VERSION }}
          key: zig-${{ env.ZIG_VERSION }}

      # ── Install everything else ───────────────────────────────
      - name: Install build dependencies
        run: source scripts/setup-runner.sh

      # ── Patch hashes ──────────────────────────────────────────
      - name: Compute patch hashes
        id: hashes
        run: |
          echo "bun_patch_hash=$(sha256sum patches/bun/android-support.patch | cut -c1-16)" >> $GITHUB_OUTPUT
          echo "zig_patch_hash=$(sha256sum patches/zig/posix-android-sigaction.patch | cut -c1-16)" >> $GITHUB_OUTPUT
          echo "webkit_patch_hash=$(sha256sum patches/webkit/android-support.patch | cut -c1-16)" >> $GITHUB_OUTPUT

      # ── Restore ICU (build if missing, ~5 min) ────────────────
      - name: Cache ICU build
        id: cache-icu
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WORK_DIR }}/deps-android/prefix
            ${{ env.WORK_DIR }}/state/nodes/icu.json
          key: build-v2-icu-${{ env.ICU_VERSION }}-${{ env.ANDROID_API }}-${{ github.event.workflow_run.head_sha || github.sha }}
          restore-keys: |
            build-v2-icu-${{ env.ICU_VERSION }}-${{ env.ANDROID_API }}-

      - name: Build ICU (if needed)
        run: |
          source scripts/env.sh && ./scripts/build-icu.sh

      # ── Restore WebKit (required — run build-core first) ──────
      - name: Restore WebKit build
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.WORK_DIR }}/webkit-android
            ${{ env.WORK_DIR }}/state/nodes/webkit.json
          key: build-v2-webkit-${{ env.WEBKIT_COMMIT }}-${{ steps.hashes.outputs.webkit_patch_hash }}-${{ github.event.workflow_run.head_sha || github.sha }}
          restore-keys: |
            build-v2-webkit-${{ env.WEBKIT_COMMIT }}-${{ steps.hashes.outputs.webkit_patch_hash }}-

      # ── Build Bun ─────────────────────────────────────────────
      - name: Cache Bun binary
        id: cache-bun
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WORK_DIR }}/bun-build/bun
            ${{ env.WORK_DIR }}/state/nodes/bun.json
          key: build-v2-bun-${{ env.BUN_VERSION }}-${{ steps.hashes.outputs.bun_patch_hash }}-${{ steps.hashes.outputs.zig_patch_hash }}-${{ github.event.workflow_run.head_sha || github.sha }}
          restore-keys: |
            build-v2-bun-${{ env.BUN_VERSION }}-${{ steps.hashes.outputs.bun_patch_hash }}-${{ steps.hashes.outputs.zig_patch_hash }}-

      - name: Clone, patch, and build Bun
        run: |
          source scripts/env.sh
          ./scripts/apply-patches.sh
          ./scripts/build-bun.sh

      - name: Verify Bun binary
        run: |
          BUN_BINARY="${WORK_DIR}/bun-build/bun"
          ls -lh "$BUN_BINARY"
          file "$BUN_BINARY"
          readelf -h "$BUN_BINARY" | grep -E "Machine|Class"

      - name: Upload Bun binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: bun-android-aarch64-${{ env.BUN_VERSION }}
          path: ${{ env.WORK_DIR }}/bun-build/bun
          if-no-files-found: error

      - name: Cleanup intermediate files
        if: always()
        run: |
          find "${WORK_DIR}" -maxdepth 1 -type f -name '*.tgz' -delete
          df -h .
