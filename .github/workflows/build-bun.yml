name: Build Bun

on:
  workflow_dispatch:
    inputs:
      bun_version:
        required: false
        default: '1.2.13'
  workflow_call:
    inputs:
      bun_version:
        required: false
        type: string
        default: '1.2.13'

concurrency:
  group: build-bun-${{ github.ref }}
  cancel-in-progress: true

env:
  PRODUCT: bun
  BUN_VERSION: "${{ inputs.bun_version || '1.2.13' }}"
  ANDROID_API: "24"
  ANDROID_NDK_VERSION: "28.1.13356709"
  ICU_VERSION: "75.1"
  ZIG_VERSION: "0.15.2"
  WEBKIT_COMMIT: "017930ebf915121f8f593bef61cbbca82d78132d"
  TINYCC_COMMIT: "b91835d8701523e895a2b447713630069514e291"
  WORK_DIR: "${{ github.workspace }}/bun/build"
  ANDROID_NDK_HOME: "${{ github.workspace }}/bun/build/android-ndk"
  ANDROID_NDK_ROOT: "${{ github.workspace }}/bun/build/android-ndk"

jobs:
  build-bun:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Create work directory
        run: mkdir -p "$WORK_DIR"

      # ── Restore cached toolchain ──────────────────────────────
      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_NDK_HOME }}
          key: ci-cache-v1-toolchain-${{ runner.os }}-${{ runner.arch }}-ndk-${{ env.ANDROID_NDK_VERSION }}-api-${{ env.ANDROID_API }}

      - name: Cache Zig
        id: cache-zig
        uses: actions/cache@v4
        with:
          path: ${{ env.WORK_DIR }}/zig-${{ env.ZIG_VERSION }}
          key: ci-cache-v1-toolchain-${{ runner.os }}-${{ runner.arch }}-zig-${{ env.ZIG_VERSION }}-api-${{ env.ANDROID_API }}

      # ── Patch hashes ──────────────────────────────────────────
      - name: Compute patch hashes
        id: hashes
        run: |
          echo "bun_patch_hash=$(sha256sum bun/patches/bun/android-support.patch | cut -c1-16)" >> $GITHUB_OUTPUT
          echo "zig_patch_hash=$(sha256sum bun/patches/zig/posix-android-sigaction.patch | cut -c1-16)" >> $GITHUB_OUTPUT
          echo "webkit_patch_hash=$(sha256sum bun/patches/webkit/android-support.patch | cut -c1-16)" >> $GITHUB_OUTPUT

      - name: Compute cache contract keys
        id: contract
        run: |
          set -euo pipefail
          export ANDROID_TRIPLE_API="aarch64-linux-android${ANDROID_API}"
          key_args=(--root "$GITHUB_WORKSPACE" --product bun
            --path bun/scripts/build-bun.sh --path bun/scripts/apply-patches.sh
            --path ci/scripts/env.sh --path bun/patches/bun/android-support.patch
            --path bun/patches/zig/posix-android-sigaction.patch
            --value "BUN_VERSION=$BUN_VERSION" --value "WEBKIT_COMMIT=$WEBKIT_COMMIT")
          echo "bun=$(python3 ci/scripts/cache-contract.py key "${key_args[@]}")" >> "$GITHUB_OUTPUT"
          echo "core=$(python3 ci/scripts/cache-contract.py key --root "$GITHUB_WORKSPACE" --product bun-core
            --path bun/scripts/build-icu.sh --path bun/scripts/build-webkit.sh
            --path bun/scripts/build-tinycc.sh --path ci/scripts/env.sh
            --value "ICU_VERSION=$ICU_VERSION" --value "WEBKIT_COMMIT=$WEBKIT_COMMIT")" >> "$GITHUB_OUTPUT"

      # Restore the final Bun output before installing packages or inspecting
      # the reusable core state. A valid hit skips all expensive build work.
      - name: Cache Bun binary
        id: cache-bun
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WORK_DIR }}/bun-build/bun
            ${{ env.WORK_DIR }}/state/nodes/bun.json
          key: ${{ steps.contract.outputs.bun }}

      # ── Restore ICU (build if missing, ~5 min) ────────────────
      - name: Cache ICU build
        id: cache-icu
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WORK_DIR }}/deps-android/prefix
            ${{ env.WORK_DIR }}/state/nodes/icu.json
          key: ${{ steps.contract.outputs.core }}-icu

      - name: Validate ICU cache
        id: validate-icu
        run: |
          set -euo pipefail
          if test -s "${WORK_DIR}/deps-android/prefix/lib/libicuuc.a" \
             && test -s "${WORK_DIR}/state/nodes/icu.json"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Restore WebKit (required — run build-core first) ──────
      - name: Restore WebKit build
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.WORK_DIR }}/webkit-android
            ${{ env.WORK_DIR }}/state/nodes/webkit.json
            ${{ env.WORK_DIR }}/state/nodes/tinycc.json
          key: ${{ steps.contract.outputs.core }}-webkit-${{ env.TINYCC_COMMIT }}

      - name: Validate WebKit cache
        id: validate-webkit
        run: |
          set -euo pipefail
          if test -s "${WORK_DIR}/webkit-android/cmakeconfig.h" \
             && test -d "${WORK_DIR}/webkit-android/include/JavaScriptCore" \
             && find "${WORK_DIR}/webkit-android/lib" -maxdepth 1 -type f -name '*.a' -size +0c -print -quit | grep -q . \
             && test -s "${WORK_DIR}/state/nodes/webkit.json"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate TinyCC prerequisite
        id: tinycc
        run: |
          set -euo pipefail
          source ci/scripts/env.sh
          if [ "${{ steps.validate-webkit.outputs.ready }}" != true ]; then
            echo "ERROR: Core cache is incomplete; WebKit/JSC is unavailable for Bun." >&2
            exit 1
          fi
          if ! test -s "${WORK_DIR}/webkit-android/lib/libtcc.a"; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Bun cache
        id: validate-bun
        run: |
          set -euo pipefail
          if test -s "${WORK_DIR}/bun-build/bun" \
             && test -s "${WORK_DIR}/state/nodes/bun.json"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build dependencies
        if: steps.validate-icu.outputs.ready != 'true' || steps.validate-webkit.outputs.ready != 'true' || steps.tinycc.outputs.needed == 'true' || steps.validate-bun.outputs.ready != 'true'
        run: source ci/scripts/setup-runner.sh

      - name: Build TinyCC (if needed)
        if: steps.tinycc.outputs.needed == 'true'
        run: |
          source ci/scripts/env.sh && ./bun/scripts/build-tinycc.sh

      - name: Build ICU (if needed)
        if: steps.validate-icu.outputs.ready != 'true'
        run: |
          source ci/scripts/env.sh && ./bun/scripts/build-icu.sh

      # ── Build Bun ─────────────────────────────────────────────
      - name: Clone, patch, and build Bun
        if: steps.cache-bun.outputs.cache-hit != 'true' || steps.validate-bun.outputs.ready != 'true'
        run: |
          source ci/scripts/env.sh
          ./bun/scripts/apply-patches.sh
          ./bun/scripts/build-bun.sh

      - name: Verify Bun binary
        run: |
          BUN_BINARY="${WORK_DIR}/bun-build/bun"
          ls -lh "$BUN_BINARY"
          file "$BUN_BINARY"
          readelf -h "$BUN_BINARY" | grep -E "Machine|Class"

      - name: Upload Bun binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: bun-android-aarch64-${{ env.BUN_VERSION }}
          path: ${{ env.WORK_DIR }}/bun-build/bun
          if-no-files-found: error

      - name: Write CI summary
        if: always()
        env:
          CACHE_DEPENDENCIES: ${{ steps.cache-icu.outputs.cache-hit == 'true' && 'hit' || 'miss' }}
          CACHE_INTERMEDIATES: ${{ steps.cache-bun.outputs.cache-hit == 'true' && 'hit' || 'miss' }}
        run: source ci/scripts/ci-summary.sh && ci_summary

      - name: Cleanup intermediate files
        if: always()
        run: |
          find "${WORK_DIR}" -maxdepth 1 -type f -name '*.tgz' -delete
          df -h .
