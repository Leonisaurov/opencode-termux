name: Build Bun

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/env.sh'
      - 'scripts/setup-runner.sh'

env:
  BUN_VERSION: "1.3.14"
  WORK_DIR: "${{ github.workspace }}/build"

jobs:
  download-bun:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Create work directory
        run: mkdir -p "$WORK_DIR/bun-build"

      - name: Cache Bun binary
        id: cache-bun
        uses: actions/cache@v4
        with:
          path: ${{ env.WORK_DIR }}/bun-build/bun
          key: bun-android-${{ env.BUN_VERSION }}

      - name: Download Bun ${{ env.BUN_VERSION }} for Android
        if: steps.cache-bun.outputs.cache-hit != 'true'
        run: |
          echo "=== Downloading Bun ${BUN_VERSION} official Android build ==="
          cd /tmp
          curl -fsSL "https://bun.sh/download/${BUN_VERSION}/linux-aarch64-android" -o bun.zip
          unzip -q bun.zip
          ls -la
          # Find the bun binary in the extracted files
          find . -name "bun" -type f -exec cp {} "${WORK_DIR}/bun-build/bun" \;

          if [ ! -f "${WORK_DIR}/bun-build/bun" ]; then
            echo "ERROR: bun binary not found in download"
            ls -la
            exit 1
          fi
          chmod +x "${WORK_DIR}/bun-build/bun"

      - name: Verify Bun binary
        run: |
          BUN_BINARY="${WORK_DIR}/bun-build/bun"
          echo "Bun binary: $BUN_BINARY"
          ls -lh "$BUN_BINARY"
          file "$BUN_BINARY"
          readelf -h "$BUN_BINARY" | grep -E "Machine|Class"
          echo "=== Bun is ready for Android ==="

      - name: Upload Bun binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: bun-android-aarch64-${{ env.BUN_VERSION }}
          path: ${{ env.WORK_DIR }}/bun-build/bun
          if-no-files-found: error
