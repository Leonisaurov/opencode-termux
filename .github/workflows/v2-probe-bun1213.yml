name: V2 Probe (B2 · emisores de grafo v2 sobre Bun Android 1.2.13)

# Sonda desechable para B2 (estrategia "Probe 1.2.13 primero").
# Pregunta: que emisor construye el arbol v2.0.24 con un grafo que acepte
# NUESTRO bun Android runtime (1.2.13-canary, fuente d7b539a5)?
# Precedente 1.18: el runtime ya acepta grafos emitidos por host 1.3.2.
# Matriz de emisores 1.2.13/1.3.2/1.4.2 con grafo trivial (control puro de
# wire-format) y CLI v2 completo. Formato del pie (verificado con el pipeline
# 1.18): [bun][grafo: string_data + module_list + Offsets(32) + trailer(16)]
# [u64 LE total_byte_count = TAMANO TOTAL DEL ARCHIVO].
# Si probe-v2-1.3.x-android arranca => B2 colapsa (sin re-port Bun).
# Si solo 1.4.2 construye v2 y su grafo no corre => CP-D. No publica nada.

on:
  workflow_dispatch:
  push:
    branches: [feat/opencode-v2]
    paths:
      - ".github/workflows/v2-probe-bun1213.yml"
      - "ci/scripts/v2-probe-build.sh"
      - "ci/scripts/v2-decatalog.py"

permissions:
  contents: read
  actions: write

concurrency:
  group: v2-probe-bun1213-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout del repo (fuente v2 vendida)
        uses: actions/checkout@v4

      - name: Preparar directorio de registro
        run: |
          set -euo pipefail
          D="${RUNNER_TEMP}/v2-bun1213-probe"
          mkdir -p "$D/logs" "$D/out"
          echo "PROBE_DIR=$D" >> "$GITHUB_ENV"

      - name: 'Recibir Bun Android 1.2.13 (artefacto verde de main, mismo pin d7b539a5)'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: "37412517206"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-bun"
          cd "$RUNNER_TEMP/android-bun"
          gh run download "$SOURCE_RUN" -R "$GITHUB_REPOSITORY" -n bun-android-aarch64-1.2.13
          find . -type f | head

      - name: 'S0: verificar Bun Android runtime (AArch64)'
        run: |
          set -uo pipefail
          L="$PROBE_DIR/logs/10_android_bun.txt"; : > "$L"
          {
            BUN_ANDROID="$(find "$RUNNER_TEMP/android-bun" -type f -name bun -print -quit)"
            echo "bun-android: $BUN_ANDROID"
            file "$BUN_ANDROID" || true
            cp "$BUN_ANDROID" "$PROBE_DIR/out/bun-android"
            chmod +x "$PROBE_DIR/out/bun-android"
            echo "ANDROID_BUN_OK"
          } >> "$L" 2>&1 || true
          cat "$L"
          grep -q ANDROID_BUN_OK "$L" || exit 1
          exit 0

      - name: 'S1: instalar emisores host 1.2.13 / 1.3.2 / 1.4.2'
        run: |
          set -uo pipefail
          L="$PROBE_DIR/logs/20_hosts.txt"; : > "$L"
          {
            for v in 1.2.13 1.3.2 1.4.2; do
              mkdir -p "$PROBE_DIR/hosts/$v"
              curl -fsSL "https://github.com/oven-sh/bun/releases/download/bun-v${v}/bun-linux-x64.zip" -o "$PROBE_DIR/hosts/$v.zip"
              unzip -q -o "$PROBE_DIR/hosts/$v.zip" -d "$PROBE_DIR/hosts/$v"
              BIN="$(find "$PROBE_DIR/hosts/$v" -type f -name bun -print -quit)"
              mv "$BIN" "$PROBE_DIR/hosts/bun-$v"
              echo "host $v -> $("$PROBE_DIR/hosts/bun-$v" --version)"
            done
            echo "HOSTS_OK"
          } >> "$L" 2>&1 || true
          cat "$L"
          grep -q HOSTS_OK "$L" || exit 1
          exit 0

      - name: 'S2: grafo trivial por emisor (control de wire-format, aislado)'
        run: |
          set -uo pipefail
          L="$PROBE_DIR/logs/30_trivial.txt"; : > "$L"
          T="$PROBE_DIR/trivial"
          for v in 1.2.13 1.3.2 1.4.2; do
            rm -rf "$T"; mkdir -p "$T"
            printf 'console.log("PROBE_BUN_%s_OK")\n' "$v" > "$T/hello.ts"
            if (cd "$T" && timeout 5m "$PROBE_DIR/hosts/bun-$v" build hello.ts --compile --outfile "$PROBE_DIR/out/trivial-host-$v") >>"$L" 2>&1; then
              echo "TRIVIAL=$v ok" >> "$L"
            else
              echo "TRIVIAL=$v fallo" >> "$L"
            fi
          done
          exit 0

      - name: 'S3: CLI v2 por emisor (copias aisladas, target bun, decatalog, lock propio)'
        run: |
          set -uo pipefail
          L="$PROBE_DIR/logs/40_v2compile.txt"; : > "$L"
          export GITHUB_WORKSPACE
          for v in 1.2.13 1.3.2 1.4.2; do
            if bash "$GITHUB_WORKSPACE/ci/scripts/v2-probe-build.sh" \
              "$PROBE_DIR/hosts/bun-$v" "$GITHUB_WORKSPACE/opencode/src" "$v" \
              "$PROBE_DIR/out/v2-host-$v" >>"$L" 2>&1; then
              echo "V2BUILD=$v ok" >> "$L"
            else
              echo "V2BUILD=$v fallo" >> "$L"
            fi
          done
          tail -80 "$L"
          exit 0

      - name: 'S4: anexar grafos al Bun Android (total_byte_count = filesize)'
        run: |
          set -uo pipefail
          L="$PROBE_DIR/logs/50_assemble.txt"; : > "$L"
          {
          node <<'NODE'
          const fs = require("fs")
          const path = require("path")
          const out = process.env.PROBE_DIR + "/out"
          const TRAILER = Buffer.from("\n---- Bun! ----\n")
          const OFFSETS = 32
          // Preserva los bytes del grafo tal cual los emitio el host (authority
          // = ese bun); el pie anexado debe declarar el tamano TOTAL del archivo.
          function extractGraph(file) {
            const b = fs.readFileSync(file)
            const limit = b.length - 8
            const tStart = limit - TRAILER.length
            if (!b.subarray(tStart, limit).equals(TRAILER)) {
              throw new Error("trailer no termina en file_size-8 en " + file)
            }
            const oStart = tStart - OFFSETS
            const byteCount = Number(b.readBigUInt64LE(oStart))
            const graphSize = byteCount + OFFSETS + TRAILER.length
            if (!(byteCount > 0 && graphSize > 0 && graphSize <= b.length))
              throw new Error("tamano de grafo ilusorio en " + file)
            return b.subarray(limit - graphSize, limit)
          }
          const android = fs.readFileSync(path.join(out, "bun-android"))
          const emitted = fs.readdirSync(out).filter((f) => f.includes("-host-"))
          for (const src of emitted) {
            const v = src.split("host-")[1]
            const kind = src.startsWith("trivial") ? "trivial" : "v2"
            const dst = `probe-${kind}-${v}-android`
            let g
            try { g = extractGraph(path.join(out, src)) } catch (e) { console.log(`SKIP ${src}: ${e.message}`); continue }
            const total = android.length + g.length + 8
            const tail = Buffer.alloc(8)
            tail.writeBigUInt64LE(BigInt(total))
            fs.writeFileSync(path.join(out, dst), Buffer.concat([android, g, tail]))
            fs.chmodSync(path.join(out, dst), 0o755)
            console.log(`${dst}: grafo ${g.length} bytes, file_size=${total}`)
          }
          NODE
          } >> "$L" 2>&1 || true
          cat "$L"
          n=0
          for f in "$PROBE_DIR"/out/probe-*-android; do
            [ -e "$f" ] || continue
            n=$((n+1))
            file "$f" | tee -a "$L"
            readelf -h "$f" | sed -n 's/^ *Machine: *//p' | grep -q AArch64 || { echo "ERROR: $f no es AArch64"; exit 1; }
          done
          test "$n" -ge 1 || { echo "ERROR: ninguna sonda anexada"; exit 1; }
          exit 0

      - name: Volcar veredicto
        run: |
          set -uo pipefail
          V="$PROBE_DIR/logs/99_verdict.txt"; : > "$V"
          {
            echo "emisores triviales: $(grep -h 'TRIVIAL=' "$PROBE_DIR/logs/30_trivial.txt" | tr '\n' ' ')"
            echo "emisores v2: $(grep -h 'V2BUILD=' "$PROBE_DIR/logs/40_v2compile.txt" | tr '\n' ' ')"
            echo "sondas anexadas: $(ls "$PROBE_DIR"/out/probe-*-android 2>/dev/null | xargs -r -n1 basename | tr '\n' ' ')"
            echo "decision dispositivo: probe-trivial-1.2.13-android debe imprimir PROBE_BUN_1.2.13_OK (anexion correcta); si ademas probe-v2-1.3.2-android arranca => B2 colapsa (emisor 1.3.x, runtime actual, sin re-port Bun); si solo 1.4.2 construye v2 y su grafo no corre => CP-D."
          } | tee "$V"

      - name: Subir sondas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-bun1213-probe-${{ github.run_number }}
          path: ${{ env.PROBE_DIR }}/out/probe-*-android
          if-no-files-found: warn

      - name: Subir logs del probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-bun1213-probe-logs-${{ github.run_number }}
          path: ${{ env.PROBE_DIR }}/logs/
