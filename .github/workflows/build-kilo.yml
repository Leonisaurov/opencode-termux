name: Build Kilo (Android aarch64)

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      use_existing_bun:
        type: boolean
        required: false
        default: false
      bun_version:
        type: string
        required: false
        default: '1.2.13'
      kilo_version:
        type: string
        required: false
        default: '7.4.20'
permissions:
  contents: read

concurrency:
  group: build-kilo-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "${{ inputs.bun_version || '1.2.13' }}"
  HOST_BUN_VERSION: '1.3.2'
  KILO_VERSION: "${{ inputs.kilo_version || '7.4.20' }}"
  KILO_BRANCH: "v${{ inputs.kilo_version || '7.4.20' }}"
  ANDROID_API: '24'
  ANDROID_NDK_VERSION: '28.1.13356709'
  ZIG_VERSION: '0.15.2'
  WORK_DIR: '${{ github.workspace }}/kilo/build'
  ANDROID_NDK_HOME: '${{ github.workspace }}/kilo/build/android-ndk'

jobs:
  core:
    if: ${{ !inputs.use_existing_bun }}
    uses: ./.github/workflows/build-core.yml
    secrets: inherit

  bun:
    needs: core
    if: ${{ !inputs.use_existing_bun }}
    uses: ./.github/workflows/build-bun.yml
    with:
      bun_version: ${{ inputs.bun_version || '1.2.13' }}
    secrets: inherit

  kilo:
    needs: [bun, core]
    if: always() && (inputs.use_existing_bun || (needs.bun.result == 'success' && (needs.core.result == 'success' || needs.core.result == 'skipped')))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Receive Bun artifact
        uses: actions/download-artifact@v4
        with:
          name: bun-android-aarch64-${{ inputs.bun_version || '1.2.13' }}
          path: ${{ env.WORK_DIR }}/artifact-bun

      - name: Materialize Android Bun for Kilo
        run: |
          set -euo pipefail
          BUN="$(find "$WORK_DIR/artifact-bun" -type f -name bun -print -quit)"
          test -n "$BUN"
          mkdir -p "$GITHUB_WORKSPACE/bun/artifacts"
          install -m 0755 "$BUN" "$GITHUB_WORKSPACE/bun/artifacts/bun-android"
          file "$GITHUB_WORKSPACE/bun/artifacts/bun-android"
          test "$(readelf -h "$GITHUB_WORKSPACE/bun/artifacts/bun-android" | sed -n 's/^ *Class: *//p')" = ELF64
          test "$(readelf -h "$GITHUB_WORKSPACE/bun/artifacts/bun-android" | sed -n 's/^ *Machine: *//p')" = AArch64

      - name: Cache Kilo NDK
        id: cache-ndk
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.ANDROID_NDK_HOME }}
          key: ci-cache-v2-toolchain-${{ runner.os }}-${{ runner.arch }}-ndk-${{ env.ANDROID_NDK_VERSION }}-api-${{ env.ANDROID_API }}

      - name: Install build dependencies and NDK
        run: source ci/scripts/setup-runner.sh

      - name: Enable zram swap
        uses: ./ci/actions/zram

      - name: Prepare Kilo source checkout
        id: kilo-source
        run: |
          set -euo pipefail
          if [ ! -d kilo/src/.git ]; then
            rm -rf kilo/src
            git clone --depth 1 --branch "v${{ inputs.kilo_version || '7.4.20' }}" \
              https://github.com/Kilo-Org/kilocode.git kilo/src
          fi
          test -f kilo/src/packages/opencode/package.json
          echo "commit=$(git -C kilo/src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compute Kilo cache contract
        id: kilo-contract
        env:
          UPSTREAM_COMMIT: ${{ steps.kilo-source.outputs.commit }}
          ANDROID_TRIPLE_API: aarch64-linux-android24
        run: |
          set -euo pipefail
          args=(--root "$GITHUB_WORKSPACE" --product kilo
            --path kilo/scripts/build.sh --path kilo/scripts/build-kilo-android.ts
            --path ci/scripts/env.sh --path .github/workflows/build-kilo.yml
            --path kilo/patches/kilocode-incremental-smoke.patch
            --path opentui/patches/opentui/android-termux-port-kilo.patch
            --path opentui/patches/opentui/android-termux-build-kilo.patch
            --path bun/artifacts/bun-android
            --path kilo/src/bun.lock --path kilo/src/package.json
            --path kilo/src/packages/opencode/package.json
            --value "KILO_VERSION=${{ inputs.kilo_version || '7.4.20' }}"
            --value "KILO_OPENTUI_REF=9b216a58d974704ae638b3043aece2eb70b5ff19"
            --value "BUN_VERSION=$BUN_VERSION" --value "HOST_BUN_VERSION=$HOST_BUN_VERSION")
          key="$(python3 ci/scripts/cache-contract.py key "${args[@]}")"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore Kilo product state
        id: cache-kilo-product
        uses: actions/cache/restore@v4
        with:
          path: |
            kilo/artifacts/kilo-android
            kilo/build/state/nodes/kilo.json
          key: ${{ steps.kilo-contract.outputs.key }}-artifact

      - name: Validate Kilo product cache
        id: validate-kilo
        run: |
          set -euo pipefail
          if test -s kilo/artifacts/kilo-android \
             && test "$(readelf -h kilo/artifacts/kilo-android | sed -n 's/^ *Class: *//p')" = ELF64 \
             && test "$(readelf -h kilo/artifacts/kilo-android | sed -n 's/^ *Machine: *//p')" = AArch64 \
             && python3 ci/scripts/build-state.py verify --root "$GITHUB_WORKSPACE" \
                  --state-dir "$WORK_DIR/state" --node kilo >/dev/null 2>&1; then
            echo ready=true >> "$GITHUB_OUTPUT"
          else
            echo ready=false >> "$GITHUB_OUTPUT"
          fi

      - name: Restore Kilo Bun dependencies
        if: steps.validate-kilo.outputs.ready != 'true'
        id: cache-kilo-dependencies
        uses: ./ci/actions/incremental-cache
        with:
          mode: restore-intermediate
          key: ci-cache-v2-kilo-dependencies-${{ runner.os }}-${{ runner.arch }}-kilo-${{ env.KILO_VERSION }}-bun-${{ env.BUN_VERSION }}-${{ steps.kilo-contract.outputs.key }}
          restore-prefix: ci-cache-v2-kilo-dependencies-${{ runner.os }}-${{ runner.arch }}-kilo-${{ env.KILO_VERSION }}-bun-${{ env.BUN_VERSION }}-
          path: ~/.bun/install/cache

      - name: Restore Kilo Zig intermediates
        if: steps.validate-kilo.outputs.ready != 'true'
        id: cache-kilo-zig
        uses: ./ci/actions/incremental-cache
        with:
          mode: restore-intermediate
          key: ci-cache-v2-kilo-intermediates-${{ runner.os }}-${{ runner.arch }}-version-${{ env.KILO_VERSION }}-bun-${{ env.BUN_VERSION }}-opentui-${{ env.KILO_BRANCH }}-api-${{ env.ANDROID_API }}-ndk-${{ env.ANDROID_NDK_VERSION }}-${{ steps.kilo-contract.outputs.key }}
          restore-prefix: ci-cache-v2-kilo-intermediates-${{ runner.os }}-${{ runner.arch }}-version-${{ env.KILO_VERSION }}-bun-${{ env.BUN_VERSION }}-opentui-${{ env.KILO_BRANCH }}-api-${{ env.ANDROID_API }}-ndk-${{ env.ANDROID_NDK_VERSION }}-
          path: |
            ${{ env.WORK_DIR }}/cache/zig-kilo
            ${{ env.WORK_DIR }}/cache/zig-global
            ${{ env.WORK_DIR }}/opentui-zig-deps

      - name: Restore Kilo resumable checkpoint
        if: steps.cache-kilo-product.outputs.cache-hit != 'true' || steps.validate-kilo.outputs.ready != 'true'
        uses: ./ci/actions/incremental-cache
        with:
          mode: restore-checkpoint
          checkpoint-prefix: ci-cache-v2-recovery-kilo-${{ runner.os }}-${{ runner.arch }}-version-${{ env.KILO_VERSION }}-bun-${{ env.BUN_VERSION }}-opentui-${{ env.KILO_BRANCH }}-api-${{ env.ANDROID_API }}-ndk-${{ env.ANDROID_NDK_VERSION }}-patch-${{ hashFiles('kilo/patches/kilocode-incremental-smoke.patch', 'opentui/patches/opentui/android-termux-port-kilo.patch', 'opentui/patches/opentui/android-termux-build-kilo.patch') }}-
          checkpoint-path: |
            ${{ github.workspace }}/kilo/src
            ${{ env.WORK_DIR }}
            ${{ github.workspace }}/kilo/artifacts
            ~/.bun

      - name: Build Kilo
        if: steps.validate-kilo.outputs.ready != 'true'
        run: |
          set -euo pipefail
          bash -n kilo/scripts/build.sh
          bash kilo/scripts/build.sh

      - name: Validate Kilo outputs for durable cache
        if: always()
        id: final-kilo
        run: |
          set -euo pipefail
          BINARY="kilo/artifacts/kilo-android"
          ready=false
          if test -s "$BINARY" \
             && python3 ci/scripts/build-state.py verify --root "$GITHUB_WORKSPACE" \
                  --state-dir "$WORK_DIR/state" --node kilo >/dev/null 2>&1 \
             && test "$(readelf -h "$BINARY" | sed -n 's/^ *Class: *//p')" = ELF64 \
             && test "$(readelf -h "$BINARY" | sed -n 's/^ *Machine: *//p')" = AArch64; then
            ready=true
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" != true ]; then
            echo "ERROR: Kilo output or state manifest is not valid." >&2
            exit 1
          fi

      - name: Save Kilo dependency cache
        if: success() && steps.validate-kilo.outputs.ready != 'true' && steps.cache-kilo-dependencies.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: ./ci/actions/incremental-cache
        with:
          mode: save-intermediate
          path: ~/.bun/install/cache
          key: ci-cache-v2-kilo-dependencies-${{ runner.os }}-${{ runner.arch }}-kilo-${{ env.KILO_VERSION }}-bun-${{ env.BUN_VERSION }}-${{ steps.kilo-contract.outputs.key }}

      - name: Save Kilo Zig intermediates
        if: success() && steps.validate-kilo.outputs.ready != 'true' && steps.cache-kilo-zig.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: ./ci/actions/incremental-cache
        with:
          mode: save-intermediate
          path: |
            ${{ env.WORK_DIR }}/cache/zig-kilo
            ${{ env.WORK_DIR }}/cache/zig-global
            ${{ env.WORK_DIR }}/opentui-zig-deps
          key: ci-cache-v2-kilo-intermediates-${{ runner.os }}-${{ runner.arch }}-version-${{ env.KILO_VERSION }}-bun-${{ env.BUN_VERSION }}-opentui-${{ env.KILO_BRANCH }}-api-${{ env.ANDROID_API }}-ndk-${{ env.ANDROID_NDK_VERSION }}-${{ steps.kilo-contract.outputs.key }}

      - name: Save Kilo product state
        if: success() && steps.final-kilo.outputs.ready == 'true' && steps.cache-kilo-product.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: ./ci/actions/incremental-cache
        with:
          mode: save-final
          path: |
            kilo/artifacts/kilo-android
            kilo/build/state/nodes/kilo.json
          key: ${{ steps.kilo-contract.outputs.key }}-artifact

      - name: Save Kilo Android NDK cache
        if: success() && steps.validate-kilo.outputs.ready != 'true' && steps.cache-ndk.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: ./ci/actions/incremental-cache
        with:
          mode: save-final
          path: ${{ env.ANDROID_NDK_HOME }}
          key: ci-cache-v2-toolchain-${{ runner.os }}-${{ runner.arch }}-ndk-${{ env.ANDROID_NDK_VERSION }}-api-${{ env.ANDROID_API }}

      - name: Upload Kilo binary
        uses: actions/upload-artifact@v4
        with:
          name: kilo-android-aarch64-${{ inputs.kilo_version || '7.4.20' }}
          path: kilo/artifacts/kilo-android
          if-no-files-found: error

      - name: Save Kilo resumable checkpoint
        if: always() && failure()
        continue-on-error: true
        uses: ./ci/actions/incremental-cache
        with:
          mode: save-checkpoint
          checkpoint-prefix: ci-cache-v2-recovery-kilo-${{ runner.os }}-${{ runner.arch }}-version-${{ env.KILO_VERSION }}-bun-${{ env.BUN_VERSION }}-opentui-${{ env.KILO_BRANCH }}-api-${{ env.ANDROID_API }}-ndk-${{ env.ANDROID_NDK_VERSION }}-patch-${{ hashFiles('kilo/patches/kilocode-incremental-smoke.patch', 'opentui/patches/opentui/android-termux-port-kilo.patch', 'opentui/patches/opentui/android-termux-build-kilo.patch') }}-
          checkpoint-path: |
            ${{ github.workspace }}/kilo/src
            ${{ env.WORK_DIR }}
            ${{ github.workspace }}/kilo/artifacts
            ~/.bun

      - name: Write CI summary
        if: always()
        env:
          CACHE_DEPENDENCIES: ${{ steps.cache-kilo-dependencies.outputs.cache-hit == 'true' && 'hit' || 'miss' }}
          CACHE_INTERMEDIATES: ${{ steps.cache-kilo-zig.outputs.cache-hit == 'true' && 'hit' || 'miss' }}
        run: source ci/scripts/ci-summary.sh && ci_summary
